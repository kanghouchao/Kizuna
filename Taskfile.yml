version: "3"

silent: true

# ルートの運用タスクを Taskfile に集約
vars:
  env: '{{default "development" .env}}'
  service: '{{default "" .service}}'

tasks:
  default:
    desc: ヘルプ情報を表示
    cmds:
      - task: help

  help:
    desc: ヘルプ情報を表示
    cmds:
      - echo "プロジェクト管理コマンド:"
      - echo ""
      - task --list

  build:
    desc: Dockerイメージをビルド
    cmds:
      - |
        if [ -n "{{.service}}" ]; then
          task -d "{{.service}}" build
        else
          task -d backend build
          task -d frontend build
        fi

  lint:
    desc: 前後端のLintを実行（service=frontend|backend|.github で個別指定可）
    cmds:
      - |
        if [ -n "{{.service}}" ]; then
          echo "🧹 {{.service}} の Lint を実行中..."
          task -d "{{.service}}" lint
        else
          echo "🧹 すべてのサービスの Lint を実行中..."
          echo "🧹 Frontend lint..."
          task -d frontend lint
          echo "🧹 Backend lint..."
          task -d backend lint
          echo "✅ Lint 完了"
        fi

  test:
    desc: 単体テストを実行
    cmds:
      - |
        if [ -n "{{.service}}" ]; then
          echo "🔍 {{.service}}サービスのテストを実行中..."
          task -d "{{.service}}" test
        else
          echo "🔍 すべてのサービスのテストを実行中..."
          echo "🧪 Frontend tests..."
          task -d frontend test
          echo "🧪 Backend tests..."
          task -d backend test
          echo "✅テスト完了"
        fi

  e2e:
    desc: E2E（playwright-bdd）を専用の使い捨てスタックで実行（build → 実行 → 破棄）
    vars:
      STACK_ID:
        sh: basename "$(git rev-parse --show-toplevel)" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g'
    env:
      COMPOSE_PROJECT_NAME: kizuna-e2e-{{.STACK_ID}}
      E2E_IMAGE_TAG: e2e-{{.STACK_ID}}
    cmds:
      - |
        command -v jq >/dev/null 2>&1 || { echo "❌ jq が必要です（e2e の Playwright 版数抽出に使用）"; exit 1; }
      - echo "🏗️  E2E 用にイメージをビルド（tag=e2e-{{.STACK_ID}}）..."
      - task -d backend build DOCKER_TAG=e2e-{{.STACK_ID}}
      - task -d frontend build DOCKER_TAG=e2e-{{.STACK_ID}}
      # 中断時の残留コンテナが次回に再利用されないよう、実行前後に匿名ボリュームごと回収する。
      # docker rm -fv は名前付きボリュームを削除せず、開発 DB のデータを保持する。
      - docker compose -f e2e/docker-compose.e2e.yml ps -aq | xargs -r docker rm -fv
      - docker compose -f e2e/docker-compose.e2e.yml down --remove-orphans
      - defer: docker compose -f e2e/docker-compose.e2e.yml ps -aq | xargs -r docker rm -fv && docker compose -f e2e/docker-compose.e2e.yml down --remove-orphans
      - |
        set -e
        echo "🎭 E2E（playwright-bdd）を実行..."
        PLAYWRIGHT_VERSION=$(jq -r '.devDependencies["@playwright/test"]' e2e/package.json | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
        export PLAYWRIGHT_VERSION
        docker compose -f e2e/docker-compose.e2e.yml run --rm e2e

  format:
    desc: すべてのサービスのフォーマットを実行（service=frontend|backend で個別指定可）
    cmds:
      - |
        if [ -n "{{.service}}" ]; then
          echo "✍️  {{.service}} のフォーマットを実行中..."
          task -d "{{.service}}" format
        else
          echo "✍️  すべてのサービスのフォーマットを実行中..."
          echo "✍️  Frontend format..."
          task -d frontend format
          echo "✍️  Backend format..."
          task -d backend format
          echo "✅ Format 完了"
        fi

  up:
    desc: サービスを起動
    cmds:
      - echo "🚀 サービスを起動中..."
      - task -d "infrastructure/{{.env}}" up

  down:
    desc: サービスを停止
    cmds:
      - echo "🛑 サービスを停止中..."
      - task -d "infrastructure/{{.env}}" down

  clean:
    desc: ビルド済み Docker イメージを削除（service=frontend|backend で個別指定可）
    cmds:
      - |
        if [ -n "{{.service}}" ]; then
          task -d "{{.service}}" clean
        else
          task -d backend clean
          task -d frontend clean
        fi
