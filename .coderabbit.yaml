# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 規約と重大度の基準は各ディレクトリの AGENTS.md（CodeRabbit が既定で読む）に置き、ここには重ねて書かない。
language: ja-JP
tone_instructions: >-
  簡潔かつ直接的に。指摘ごとに根拠となる箇所と直し方を一つずつ示す。
reviews:
  profile: chill
  pre_merge_checks:
    docstrings:
      mode: "off"
  finishing_touches:
    docstrings:
      enabled: false
