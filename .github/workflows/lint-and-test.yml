name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  repo-lint:
    name: Repo Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ワークフローと E2E 型の検査は docs-only でも省略しない。
      - name: Repo lint
        run: task lint service=.github

      # ベースイメージは dhi.io（Docker Hardened Images）から取るため、Docker Hub の資格情報でログインする
      - name: Log in to dhi.io
        uses: docker/login-action@v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Check E2E types
        run: task lint service=e2e

  lint-and-test-frontend:
    name: Lint and Test (frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # docs-only 判定で HEAD^1（ベース側の親）との diff を取るため 2 世代必要
          fetch-depth: 2

      # docs-only 判定: コード領域に触れない PR では重いゲートを省略する。
      # エリア連動スキップ（backend のみの diff で本 job を省く等）はしない（全域で同じ境界を見る）。
      - name: Detect docs-only diff
        id: diff
        run: .github/scripts/detect-docs-only.sh

      - name: Set up Docker Buildx
        if: steps.diff.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@v4.3.0
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to dhi.io
        if: steps.diff.outputs.docs_only != 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        if: steps.diff.outputs.docs_only != 'true'
        run: task -d frontend lint
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain

      - name: Test
        if: steps.diff.outputs.docs_only != 'true'
        run: task -d frontend test
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain

      - name: Build
        if: steps.diff.outputs.docs_only != 'true'
        run: task -d frontend build
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain

  lint-and-test-backend:
    name: Lint and Test (backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # docs-only 判定で HEAD^1（ベース側の親）との diff を取るため 2 世代必要
          fetch-depth: 2

      # docs-only 判定: コード領域に触れない PR では重いゲートを省略する。
      # エリア連動スキップ（frontend のみの diff で本 job を省く等）はしない（全域で同じ境界を見る）。
      - name: Detect docs-only diff
        id: diff
        run: .github/scripts/detect-docs-only.sh

      - name: Set up Docker Buildx
        if: steps.diff.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@v4.3.0
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to dhi.io
        if: steps.diff.outputs.docs_only != 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        if: steps.diff.outputs.docs_only != 'true'
        run: task -d backend lint
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain

      - name: Test
        if: steps.diff.outputs.docs_only != 'true'
        run: task -d backend test
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain

      - name: Build
        if: steps.diff.outputs.docs_only != 'true'
        run: task -d backend build
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain

  postgres-test-backend:
    name: PostgreSQL Test (backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # docs-only 判定で HEAD^1（ベース側の親）との diff を取るため 2 世代必要
          fetch-depth: 2

      - name: Detect docs-only diff
        id: diff
        run: .github/scripts/detect-docs-only.sh

      - name: Set up Docker Buildx
        if: steps.diff.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@v4.3.0
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to dhi.io
        if: steps.diff.outputs.docs_only != 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: PostgreSQL test
        if: steps.diff.outputs.docs_only != 'true'
        run: task -d backend test:postgres
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
