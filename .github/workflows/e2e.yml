name: E2E

# 全量は master へ入った後に走らせる。PR では作者が変更に関係するシナリオだけをローカルで回し、
# 誰も合併前に全量を待たない。落ちたら最後の job が issue を立て、次の PR で直す。
on:
  push:
    branches:
      - master
  workflow_dispatch:

# 合併が続いたら古い実行は捨て、最新の master だけを検証する（最新は先行する合併を全て含む）。
# ref ごとに分けるので、別ブランチの手動実行が master の検証を取り消すことはない。
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: E2E build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      # ベースイメージは dhi.io（Docker Hardened Images）から取るため、Docker Hub の資格情報でログインする
      - name: Log in to dhi.io
        uses: docker/login-action@v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: task e2e:build
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain

      # shard ごとに作り直さず、一度ビルドしたイメージを全 shard へ配る。
      - name: Export images
        run: |
          mapfile -t images < <(docker images --format '{{.Repository}}:{{.Tag}}' --filter 'reference=kizuna-*:e2e-*')
          docker save "${images[@]}" | gzip -1 > e2e-images.tar.gz

      - name: Upload images
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-images
          path: e2e-images.tar.gz
          # gzip 済みなので二重に圧縮しない
          compression-level: 0
          retention-days: 1

  shard:
    name: E2E shard ${{ matrix.shard }}/4
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to dhi.io
        uses: docker/login-action@v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download images
        uses: actions/download-artifact@v8.0.2
        with:
          name: e2e-images

      - name: Load images
        run: gunzip -c e2e-images.tar.gz | docker load

      - name: Run E2E
        run: task e2e:run shard=${{ matrix.shard }}/4

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: e2e/test-results
          retention-days: 7

  report:
    name: E2E
    needs: [build, shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download blob reports
        if: needs.shard.result != 'skipped'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: e2e-blob-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge reports
        if: needs.shard.result != 'skipped'
        run: |
          PLAYWRIGHT_VERSION=$(jq -r '.devDependencies["@playwright/test"]' e2e/package.json | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
          docker run --rm -v "$PWD/e2e:/e2e" -w /e2e "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble" \
            sh -c 'npm install --legacy-peer-deps --no-audit --no-fund && npx playwright merge-reports --reporter html ./all-blob-reports'

      - name: Upload HTML report
        if: needs.shard.result != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-html-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Require all shards to pass
        if: needs.shard.result != 'success'
        run: |
          echo "E2E の shard が成功していない（build=${{ needs.build.result }} shard=${{ needs.shard.result }}）"
          exit 1

      # 赤い master を誰かが見るための唯一の経路。未解決の issue があれば同じ issue に追記し、増やさない。
      # 別ブランチの手動実行の失敗は master の状態ではないので報告しない。
      - name: Report failure as an issue
        if: failure() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="master の全量 E2E が失敗している"
          body=$(cat <<EOF
          master の全量 E2E が失敗した。

          - コミット: ${GITHUB_SHA}
          - 実行: ${RUN_URL}
          - 統合レポートは実行ページの artifact e2e-html-report、失敗した shard の trace は e2e-test-results-<shard>

          次の PR で直す。すぐに直せない場合は原因の合併を revert する。
          EOF
          )
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label bug --label implementation --body "$body"
          fi
