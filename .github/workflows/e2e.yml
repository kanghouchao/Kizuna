name: E2E

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]

# 同じ PR に新しい push が来たら、走っている全量 E2E は結果を待たずに捨てる。
concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: E2E build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # docs-only 判定で HEAD^1（ベース側の親）との diff を取るため 2 世代必要
          fetch-depth: 2

      - name: Detect docs-only diff
        id: diff
        run: .github/scripts/detect-docs-only.sh

      - name: Set up Docker Buildx
        if: steps.diff.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@v4.3.0
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      # ベースイメージは dhi.io（Docker Hardened Images）から取るため、Docker Hub の資格情報でログインする
      - name: Log in to dhi.io
        if: steps.diff.outputs.docs_only != 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Set up Task
        if: steps.diff.outputs.docs_only != 'true'
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        if: steps.diff.outputs.docs_only != 'true'
        run: task e2e:build
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain

      # shard ごとに作り直さず、一度ビルドしたイメージを全 shard へ配る。
      - name: Export images
        if: steps.diff.outputs.docs_only != 'true'
        run: |
          mapfile -t images < <(docker images --format '{{.Repository}}:{{.Tag}}' --filter 'reference=kizuna-*:e2e-*')
          docker save "${images[@]}" | gzip -1 > e2e-images.tar.gz

      - name: Upload images
        if: steps.diff.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-images
          path: e2e-images.tar.gz
          # gzip 済みなので二重に圧縮しない
          compression-level: 0
          retention-days: 1

  shard:
    name: E2E shard ${{ matrix.shard }}/4
    needs: build
    if: needs.build.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to dhi.io
        uses: docker/login-action@v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download images
        uses: actions/download-artifact@v8.0.2
        with:
          name: e2e-images

      - name: Load images
        run: gunzip -c e2e-images.tar.gz | docker load

      - name: Run E2E
        run: task e2e:run shard=${{ matrix.shard }}/4

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: e2e/test-results
          retention-days: 7

  # 必須チェックはこの job 一つ（shard 数を変えてもチェック名が変わらない）。
  report:
    name: E2E
    needs: [build, shard]
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip for docs-only diff
        if: needs.build.outputs.docs_only == 'true'
        run: echo "docs-only の差分なので E2E を省略した"

      - name: Checkout
        if: needs.build.outputs.docs_only != 'true'
        uses: actions/checkout@v7

      - name: Download blob reports
        if: needs.build.outputs.docs_only != 'true' && needs.shard.result != 'skipped'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: e2e-blob-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge reports
        if: needs.build.outputs.docs_only != 'true' && needs.shard.result != 'skipped'
        run: |
          PLAYWRIGHT_VERSION=$(jq -r '.devDependencies["@playwright/test"]' e2e/package.json | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
          docker run --rm -v "$PWD/e2e:/e2e" -w /e2e "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble" \
            sh -c 'npm install --legacy-peer-deps --no-audit --no-fund && npx playwright merge-reports --reporter html ./all-blob-reports'

      - name: Upload HTML report
        if: needs.build.outputs.docs_only != 'true' && needs.shard.result != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-html-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Require all shards to pass
        if: needs.build.outputs.docs_only != 'true' && needs.shard.result != 'success'
        run: |
          echo "E2E の shard が成功していない（build=${{ needs.build.result }} shard=${{ needs.shard.result }}）"
          exit 1
