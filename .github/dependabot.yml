version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]
    # typescript-eslint が TS 7 を、eslint-plugin-react が ESLint 10 をまだ受け付けず lint が起動しない。
    # TS は typescript-eslint の peerDependencies 上限（<6.1.0）に合わせて除外し、6.0.x は通す。
    # 両プラグインの peerDependencies が新メジャーを含んだらこの除外を外す。
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]
