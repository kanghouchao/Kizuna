databaseChangeLog:
  - changeSet:
      id: store-v01000-002-customer-drop-points
      author: kanghouchao
      # 保有ポイントは店舗の顧客ではなくプラットフォーム級の会員が持つ。店舗ごとに残高を持つと、
      # 同じ会員の残高が店舗の数だけ生まれ、どれが本当の残高か決まらなくなる。
      preConditions:
        # コード上の書き手は定数 0 のみだが、実データの帯掛けとして残高が乗った行があれば止める。
        - dbms:
            type: postgresql
        - onFail: HALT
        - onFailMessage: >-
            t_customers.points に 0 以外の残高を持つ行があります。
            列を落とすとその残高は復元できないため、会員ポイント台帳へ移してから再実行してください。
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM t_customers WHERE points <> 0
      changes:
        - dropColumn:
            tableName: t_customers
            columnName: points
      # 巻き戻しは同じ release の台帳作成まで連なり、この列を戻した直後に台帳表そのものが落ちる。
      # 仕訳が 1 件でもあれば、戻した列は既定値 0 のまま残高だけが消えるため、成功と報せずに止める。
      rollback:
        - sql:
            splitStatements: false
            sql: >-
              DO $$ BEGIN IF EXISTS (SELECT 1 FROM t_point_entries) THEN
              RAISE EXCEPTION 'ポイント台帳に仕訳が残っているため巻き戻せません。戻した t_customers.points は 0 のままで、台帳の削除により残高が失われます'; END IF; END $$;
        - addColumn:
            tableName: t_customers
            columns:
              - column:
                  name: points
                  type: INTEGER
                  defaultValueNumeric: 0
                  remarks: 保有ポイント
