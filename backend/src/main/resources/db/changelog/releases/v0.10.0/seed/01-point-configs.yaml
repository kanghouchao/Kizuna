databaseChangeLog:
  - changeSet:
      id: seed-v01000-001-point-configs
      author: kanghouchao
      # ポイント制度の既定値。「100 円ごとに 1 ポイント付与、利用は 100 ポイント単位」から始める。
      # 付与側は単位金額か単位あたり付与のどちらかが 0 以下なら付与しない設定として扱われる。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "point_grant_unit_amount" }
              - column: { name: config_value, value: "100" }
              - column: { name: category, value: "POINT" }
              - column: { name: description, value: "ポイント付与の単位金額（円）" }
              - column: { name: value_type, value: "NUMBER" }
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "point_grant_points_per_unit" }
              - column: { name: config_value, value: "1" }
              - column: { name: category, value: "POINT" }
              - column: { name: description, value: "単位金額あたりの付与ポイント" }
              - column: { name: value_type, value: "NUMBER" }
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "point_usage_unit" }
              - column: { name: config_value, value: "100" }
              - column: { name: category, value: "POINT" }
              - column: { name: description, value: "ポイント利用の単位" }
              - column: { name: value_type, value: "NUMBER" }
      rollback:
        - delete:
            tableName: t_system_configs
            where: config_key in ('point_grant_unit_amount', 'point_grant_points_per_unit', 'point_usage_unit')
