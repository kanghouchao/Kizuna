databaseChangeLog:
  - changeSet:
      id: store-v0400-001-order-drop-store-name
      author: kanghouchao
      # Order の店舗帰属は store_id（FK）のみが正とする。自由入力の store_name は重複した表現のため廃止する。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - dropColumn:
            tableName: t_orders
            columnName: store_name
      rollback:
        - addColumn:
            tableName: t_orders
            columns:
              - column:
                  name: store_name
                  type: VARCHAR(255)
                  remarks: 店舗名
