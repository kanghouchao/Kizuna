databaseChangeLog:
  - changeSet:
      id: platform-v01100-001-point-entry-idempotency-key
      author: kanghouchao
      # 手動ポイント調整の冪等キー（ADR 0007）。応答喪失後の再送が台帳へ二重記帳されるのを、
      # クライアント生成キーの一意制約で機構的に遮断する。キーを持つのは手動調整の仕訳のみで、
      # 他種別は NULL（PostgreSQL の UNIQUE は NULL 同士を別値と見るため部分インデックスは不要）。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - addColumn:
            tableName: t_point_entries
            columns:
              - column:
                  name: idempotency_key
                  type: VARCHAR(64)
                  remarks: 手動調整の冪等キー（クライアント生成。手動調整以外は NULL。値を持つ行は一意）
        - addUniqueConstraint:
            constraintName: uq_t_point_entries_idempotency_key
            tableName: t_point_entries
            columnNames: idempotency_key
      rollback:
        - dropUniqueConstraint:
            constraintName: uq_t_point_entries_idempotency_key
            tableName: t_point_entries
        - dropColumn:
            tableName: t_point_entries
            columnName: idempotency_key
