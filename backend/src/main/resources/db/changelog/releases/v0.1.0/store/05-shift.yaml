databaseChangeLog:
  - changeSet:
      id: store-v0100-005-shift-schema
      author: kanghouchao
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_shifts
            remarks: 出勤（シフト）情報テーブル
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_shifts
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: cast_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                  remarks: 出勤するキャスト
              - column:
                  name: work_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: 勤務日
              - column:
                  name: start_time
                  type: TIME
                  constraints:
                    nullable: false
                  remarks: 開始時刻
              - column:
                  name: end_time
                  type: TIME
                  constraints:
                    nullable: false
                  remarks: 終了時刻（start_time 以下なら翌日にまたがる勤務）
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: TENTATIVE
                  constraints:
                    nullable: false
                  remarks: ステータス（TENTATIVE=仮/CONFIRMED=確定）
              - column:
                  name: created_by
                  type: BIGINT
                  remarks: この行を作成した操作の実行者。利用者削除後も行を残すため SET NULL
              - column:
                  name: updated_by
                  type: BIGINT
                  remarks: この行を最後に書き換えた操作の実行者（作成のみなら NULL）。同じ理由で SET NULL
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - addForeignKeyConstraint:
            constraintName: fk_t_shifts_store
            baseTableName: t_shifts
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_shifts_cast
            baseTableName: t_shifts
            baseColumnNames: cast_id
            referencedTableName: t_casts
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_shifts_created_by
            baseTableName: t_shifts
            baseColumnNames: created_by
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            constraintName: fk_t_shifts_updated_by
            baseTableName: t_shifts
            baseColumnNames: updated_by
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            indexName: idx_t_shifts_store_work_date
            tableName: t_shifts
            columns:
              - column:
                  name: store_id
              - column:
                  name: work_date
        # 本人ポータルの週間スケジュール読みは cast_id 集合＋work_date 範囲で絞り store_id を
        # 条件に含めないため、上の複合索引では絞り込めない。専用の複合索引を持つ。
        - createIndex:
            indexName: idx_t_shifts_cast_work_date
            tableName: t_shifts
            columns:
              - column:
                  name: cast_id
              - column:
                  name: work_date
