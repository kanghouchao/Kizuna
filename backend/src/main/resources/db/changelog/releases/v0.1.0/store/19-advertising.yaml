databaseChangeLog:
  - changeSet:
      id: store-v0100-019-advertising_costs
      author: kizuna
      changes:
        - createTable:
            tableName: t_advertising_costs
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_advertising_costs
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: month
                  type: VARCHAR(7)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: media_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: agency_name
                  type: VARCHAR(200)
              - column:
                  name: plan_name
                  type: VARCHAR(200)
              - column:
                  name: inquiry_count
                  type: INTEGER
              - column:
                  name: amount
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: revision
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: t_advertising_costs
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            constraintName: fk_t_advertising_costs_store_id
            onDelete: CASCADE
        - sql:
            sql: |
              ALTER TABLE t_advertising_costs ADD CONSTRAINT ck_t_advertising_costs_values CHECK (amount >= 0 AND (inquiry_count IS NULL OR inquiry_count >= 0) AND category IN ('SALES','RECRUITMENT'));
              CREATE INDEX idx_t_advertising_costs_month ON t_advertising_costs(store_id, month, id) WHERE deleted = false;
