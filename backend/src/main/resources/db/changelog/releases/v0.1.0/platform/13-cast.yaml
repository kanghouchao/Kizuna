databaseChangeLog:
  - changeSet:
      id: platform-v0100-013-cast
      author: kanghouchao
      changes:
        - createTable:
            tableName: t_casts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_casts
              - column:
                  name: platform_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: real_name
                  type: VARCHAR(255)
              - column:
                  name: birth_date
                  type: DATE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_t_casts_platform_user
            baseTableName: t_casts
            baseColumnNames: platform_user_id
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: NO ACTION
        - sql:
            sql: ALTER TABLE t_casts ADD CONSTRAINT uq_t_casts_platform_user UNIQUE (platform_user_id)
