databaseChangeLog:
  - changeSet:
      id: store-v0100-002-cast-schema
      author: kanghouchao
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_cast_enrollments
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_cast_enrollments
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: cast_id
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "ENROLLED"
                  constraints:
                    nullable: false
              - column:
                  name: ended_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: custom_fields
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_enrollments_store
            baseTableName: t_cast_enrollments
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_enrollments_cast
            baseTableName: t_cast_enrollments
            baseColumnNames: cast_id
            referencedTableName: t_casts
            referencedColumnNames: id
            onDelete: NO ACTION
        - sql:
            sql: ALTER TABLE t_cast_enrollments ADD CONSTRAINT ck_t_cast_enrollments_status CHECK (status IN ('ENROLLED', 'SUSPENDED', 'WITHDRAWN'))
        - sql:
            sql: CREATE UNIQUE INDEX uq_t_cast_enrollments_current ON t_cast_enrollments (cast_id, store_id) WHERE status <> 'WITHDRAWN'
        - createTable:
            tableName: t_cast_profiles
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_cast_profiles
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: enrollment_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: photo_url
                  type: VARCHAR(500)
              - column:
                  name: introduction
                  type: TEXT
              - column:
                  name: age
                  type: INTEGER
              - column:
                  name: height
                  type: INTEGER
              - column:
                  name: bust
                  type: INTEGER
              - column:
                  name: waist
                  type: INTEGER
              - column:
                  name: hip
                  type: INTEGER
              - column:
                  name: display_order
                  type: INTEGER
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
              - column:
                  name: custom_fields
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: publication_status
                  type: VARCHAR(20)
                  defaultValue: "UNPUBLISHED"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_profiles_store
            baseTableName: t_cast_profiles
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_profiles_enrollment
            baseTableName: t_cast_profiles
            baseColumnNames: enrollment_id
            referencedTableName: t_cast_enrollments
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: ALTER TABLE t_cast_profiles ADD CONSTRAINT uq_t_cast_profiles_enrollment UNIQUE (enrollment_id)
        - sql:
            sql: ALTER TABLE t_cast_profiles ADD CONSTRAINT ck_t_cast_profiles_publication CHECK (publication_status IN ('PUBLISHED', 'UNPUBLISHED'))
        - createTable:
            tableName: t_cast_enrollment_status_histories
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_cast_enrollment_status_histories
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: enrollment_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: previous_status
                  type: VARCHAR(20)
              - column:
                  name: new_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_enrollment_status_histories_store
            baseTableName: t_cast_enrollment_status_histories
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_enrollment_status_histories_enrollment
            baseTableName: t_cast_enrollment_status_histories
            baseColumnNames: enrollment_id
            referencedTableName: t_cast_enrollments
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_enrollment_status_histories_actor
            baseTableName: t_cast_enrollment_status_histories
            baseColumnNames: actor_id
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: NO ACTION
        - sql:
            sql: ALTER TABLE t_cast_enrollment_status_histories ADD CONSTRAINT ck_t_cast_enrollment_status_histories_previous_status CHECK (previous_status IN ('ENROLLED', 'SUSPENDED', 'WITHDRAWN'))
        - sql:
            sql: ALTER TABLE t_cast_enrollment_status_histories ADD CONSTRAINT ck_t_cast_enrollment_status_histories_new_status CHECK (new_status IN ('ENROLLED', 'SUSPENDED', 'WITHDRAWN'))
        - createTable:
            tableName: t_cast_enrollment_snapshots
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_cast_enrollment_snapshots
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: enrollment_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: custom_fields
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_enrollment_snapshots_store
            baseTableName: t_cast_enrollment_snapshots
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_enrollment_snapshots_enrollment
            baseTableName: t_cast_enrollment_snapshots
            baseColumnNames: enrollment_id
            referencedTableName: t_cast_enrollments
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_enrollment_snapshots_actor
            baseTableName: t_cast_enrollment_snapshots
            baseColumnNames: actor_id
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: NO ACTION
        - createTable:
            tableName: t_cast_field_definitions
            remarks: キャストのカスタムフィールド定義テーブル（店舗別動的属性）
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_cast_field_definitions
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: key
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                  remarks: プログラム識別子（不変・店舗内一意）
              - column:
                  name: label
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                  remarks: 表示ラベル
              - column:
                  name: display_order
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 表示順（サーバ側自動採番）
              - column:
                  name: is_public
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
                  remarks: 公開詳細ページに表示するか
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_field_definitions_store
            baseTableName: t_cast_field_definitions
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: t_cast_field_definitions
            columnNames: store_id,key
            constraintName: uq_t_cast_field_definitions_store_key
        - createTable:
            tableName: t_cast_invitations
            remarks: キャスト招待テーブル
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_cast_invitations
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: cast_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                  remarks: 招待対象のキャスト ID
              - column:
                  name: token
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_t_cast_invitations_token
                  remarks: 招待リンクのトークン
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: 物理状態(PENDING/ACCEPTED/INVALIDATED)
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  remarks: 有効期限
              - column:
                  name: accepted_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: 受諾日時
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_invitations_store
            baseTableName: t_cast_invitations
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_cast_invitations_cast
            baseTableName: t_cast_invitations
            baseColumnNames: cast_id
            referencedTableName: t_cast_enrollments
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              -- キャストあたり有効(PENDING)な招待は最大 1 件に制限する部分ユニークインデックス。
              -- token 一意制約だけでは異なるトークンの二重 PENDING を防げず、issue() が並行すると
              -- 複数の有効トークンが発行されうるため、DB レベルで直列化する。
              CREATE UNIQUE INDEX uq_t_cast_invitations_pending_cast
              ON t_cast_invitations (cast_id)
              WHERE status = 'PENDING';
