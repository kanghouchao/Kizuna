databaseChangeLog:
  - changeSet:
      id: seed-v0100-001-roles
      author: kanghouchao
      # 権限目録（PermissionCode enum 名の全件）と平台既定ロール 3 件、および既定ロールへの初期授与。
      # 既定ロールは is_system=true で改名・削除を拒否し、権限は管理者が編集できる。id は採番に委ね、中間表は自然キー
      # （ロール名・権限コード）の部分問い合わせで解決する。
      # 本 changeset は PermissionCode の宣言（defaultRoles）と一致していなければならず、PermissionSeedLiteralTests が
      # 機械検証する。reconcile は既定ロール行を初めて作る時だけ授与を播種するので、起動のたびに取り直されることはない。
      preConditions:
        - dbms:
            type: postgresql
