databaseChangeLog:
  - changeSet:
      id: seed-v0100-003-system-configs
      author: kanghouchao
      # SMTP は「未設定（空文字）＝環境変数フォールバック」が既定。値を入れると DB 側が優先される。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "maintenance_mode" }
              - column: { name: config_value, value: "false" }
              - column: { name: category, value: "SYSTEM" }
              - column: { name: description, value: "システムメンテナンスモード" }
              - column: { name: value_type, value: "BOOLEAN" }
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "smtp_host" }
              - column: { name: config_value, value: "" }
              - column: { name: category, value: "SMTP" }
              - column: { name: description, value: "SMTPサーバーホスト" }
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "smtp_port" }
              - column: { name: config_value, value: "25" }
              - column: { name: category, value: "SMTP" }
              - column: { name: description, value: "SMTPサーバーポート" }
              - column: { name: value_type, value: "NUMBER" }
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "smtp_username" }
              - column: { name: config_value, value: "" }
              - column: { name: category, value: "SMTP" }
              - column: { name: description, value: "SMTP認証ユーザー名" }
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "smtp_password" }
              - column: { name: config_value, value: "" }
              - column: { name: category, value: "SMTP" }
              - column: { name: description, value: "SMTP認証パスワード" }
              - column: { name: secret, valueBoolean: true }
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "smtp_from" }
              - column: { name: config_value, value: "" }
              - column: { name: category, value: "SMTP" }
              - column: { name: description, value: "メール送信元アドレス" }
        # LINE ログインのチャネル資格情報。SMTP と同じく「未設定（空文字）＝環境変数フォールバック」が
        # 既定で、値を入れると DB 側が優先される（環境変数は LINE_CHANNEL_ID / LINE_CHANNEL_SECRET）。
        # 双方とも空なら LINE ログインは無効（GET /platform/line/config が enabled=false を返す）。
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "line_channel_id" }
              - column: { name: config_value, value: "" }
              - column: { name: category, value: "LINE" }
              - column: { name: description, value: "LINEログインチャネルID" }
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "line_channel_secret" }
              - column: { name: config_value, value: "" }
              - column: { name: category, value: "LINE" }
              - column: { name: description, value: "LINEログインチャネルシークレット" }
              - column: { name: secret, valueBoolean: true }
        # ポイント制度の既定値。「100 円ごとに 1 ポイント付与、利用は 100 ポイント単位」から始める。
        # 付与側は単位金額か単位あたり付与のどちらかが 0 以下なら付与しない設定として扱われる。
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "point_grant_unit_amount" }
              - column: { name: config_value, value: "100" }
              - column: { name: category, value: "POINT" }
              - column: { name: description, value: "ポイント付与の単位金額（円）" }
              - column: { name: value_type, value: "NUMBER" }
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "point_grant_points_per_unit" }
              - column: { name: config_value, value: "1" }
              - column: { name: category, value: "POINT" }
              - column: { name: description, value: "単位金額あたりの付与ポイント" }
              - column: { name: value_type, value: "NUMBER" }
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "point_usage_unit" }
              - column: { name: config_value, value: "100" }
              - column: { name: category, value: "POINT" }
              - column: { name: description, value: "ポイント利用の単位" }
              - column: { name: value_type, value: "NUMBER" }
        # 営業日の日付変更時刻。初期値 00:00 は暦日と一致する（導入自体は挙動を変えない）。
        # 実値は運用で設定する — 25 時閉店の店の深夜勤務を前営業日へ帰属させたいなら 05:00 など。
        - insert:
            tableName: t_system_configs
            columns:
              - column: { name: config_key, value: "business_date_change_time" }
              - column: { name: config_value, value: "00:00" }
              - column: { name: category, value: "SYSTEM" }
              - column: { name: description, value: "営業日の日付変更時刻（HH:mm。プラットフォーム統一）" }
              - column: { name: value_type, value: "TIME" }
