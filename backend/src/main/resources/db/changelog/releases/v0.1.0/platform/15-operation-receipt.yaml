databaseChangeLog:
  - changeSet:
      id: platform-v0100-015-operation-receipt-schema
      author: kanghouchao
      changes:
        - createTable:
            tableName: t_operation_receipts
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_operation_receipts
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: operation_key
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: fingerprint
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: operation
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: committed_facts
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: t_operation_receipts
            columnNames: store_id, actor_id, operation_key
            constraintName: uq_t_operation_receipts_key
        # 受領は店舗の業務記録とともに店舗削除で消える。操作者は受領が指す限り削除させない。
        - addForeignKeyConstraint:
            baseTableName: t_operation_receipts
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            constraintName: fk_t_operation_receipts_store
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: t_operation_receipts
            baseColumnNames: actor_id
            referencedTableName: t_users
            referencedColumnNames: id
            constraintName: fk_t_operation_receipts_actor
            onDelete: NO ACTION
