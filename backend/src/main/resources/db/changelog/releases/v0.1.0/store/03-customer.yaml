databaseChangeLog:
  - changeSet:
      id: store-v0100-003-customer-schema
      author: kanghouchao
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_customers
            remarks: 顧客情報テーブル
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_customers
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  remarks: 顧客名
              - column:
                  name: address
                  type: VARCHAR(500)
                  remarks: 住所
              - column:
                  name: building_name
                  type: VARCHAR(255)
                  remarks: 建物名
              - column:
                  name: landmark
                  type: VARCHAR(255)
                  remarks: 目印
              - column:
                  name: classification
                  type: VARCHAR(50)
                  remarks: 区分（自宅、ホテルなど）
              - column:
                  name: has_pet
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: ペットの有無
              - column:
                  name: usage_areas
                  type: VARCHAR(255)
                  remarks: 利用エリア
              - column:
                  name: ng_type
                  type: VARCHAR(50)
                  remarks: NGタイプ（注意・禁止など）
              - column:
                  name: ng_content
                  type: TEXT
                  remarks: NG内容
              - column:
                  # 統合先参照（ADR 0010）。NULL が「生きている行」で、値があればその行は墓標。
                  name: merged_into_id
                  type: VARCHAR(64)
                  remarks: 統合先の顧客。NULL は生きている行で、値があれば墓標
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - addForeignKeyConstraint:
            constraintName: fk_t_customers_store
            baseTableName: t_customers
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        # 自己参照の外部キーは削除を止める — 墓標の指す先が消えると旧 ID の解決が切れるため（ADR 0010）。
        # 拒否を 409 の案内へ写すので NO ACTION（理由は DbConstraint の Javadoc）。
        - addForeignKeyConstraint:
            constraintName: fk_t_customers_merged_into
            baseTableName: t_customers
            baseColumnNames: merged_into_id
            referencedTableName: t_customers
            referencedColumnNames: id
            onDelete: NO ACTION
        # 「受注・関連が参照する顧客は生きている行である」を DB に宣言的に守らせるための参照先。
        # PostgreSQL は条件付き外部キーも CHECK 内の副問い合わせも持たないので、生きているかを
        # 生成列にして (id, alive) を複合外部キーの参照先にするのが唯一の宣言的な手段になる。
        - sql:
            sql: >-
              ALTER TABLE t_customers
              ADD COLUMN alive BOOLEAN GENERATED ALWAYS AS (merged_into_id IS NULL) STORED
        - addUniqueConstraint:
            tableName: t_customers
            columnNames: id,alive
            constraintName: uq_t_customers_id_alive
        - sql:
            # 連鎖統合の圧平は「被統合行を指している墓標」を一括で書き換える。PostgreSQL は参照側の
            # 外部キー列に索引を作らず、値を持つのは墓標だけなので部分索引にする。
            sql: >-
              CREATE INDEX idx_t_customers_merged_into
              ON t_customers (merged_into_id)
              WHERE merged_into_id IS NOT NULL

  - changeSet:
      id: store-v0100-003-customer-merge-history
      author: kanghouchao
      # 統合履歴。統合に取消（undo）は無く、誤統合の修復は「誰が・いつ・どの行をどの行へ・何を移したか」を
      # 根拠とする人手作業になる（ADR 0010）。移した件数は統合時の一括 UPDATE の結果をそのまま残す
      # （後から数え直すと、統合後に積まれた受注・関連まで数えてしまい根拠にならない）。
      #
      # 顧客への外部キーは両方とも削除を止める。結果として統合に関与した行は存続行・被統合行とも削除できなく
      # なるが、修復の根拠と旧 ID の解決が誤削除で消えるほうが重い。実行者は削除されても履歴が残るよう
      # SET NULL（表示名の欠落で行ごと消さない）。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_customer_merges
            remarks: 顧客統合の履歴
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_customer_merges
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: surviving_customer_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                  remarks: 統合後に台帳へ残る行
              - column:
                  name: merged_customer_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                  remarks: 墓標になった行
              - column:
                  name: merged_by
                  type: BIGINT
                  remarks: 統合の実行者。利用者削除後も履歴を残すため SET NULL
              - column:
                  name: merged_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  remarks: 統合の実行時刻
              - column:
                  name: moved_order_count
                  type: INTEGER
                  constraints:
                    nullable: false
                  remarks: 存続行へ付け替えた受注の件数
              - column:
                  name: moved_link_count
                  type: INTEGER
                  constraints:
                    nullable: false
                  remarks: 存続行へ付け替えた関連の件数（ACTIVE・RELEASED の全区間）
              - column:
                  name: moved_contact_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: operation_reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: evidence
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - addForeignKeyConstraint:
            constraintName: fk_t_customer_merges_store
            baseTableName: t_customer_merges
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_customer_merges_surviving
            baseTableName: t_customer_merges
            baseColumnNames: surviving_customer_id
            referencedTableName: t_customers
            referencedColumnNames: id
            onDelete: NO ACTION
        - addForeignKeyConstraint:
            constraintName: fk_t_customer_merges_merged
            baseTableName: t_customer_merges
            baseColumnNames: merged_customer_id
            referencedTableName: t_customers
            referencedColumnNames: id
            onDelete: NO ACTION
        - addForeignKeyConstraint:
            constraintName: fk_t_customer_merges_merged_by
            baseTableName: t_customer_merges
            baseColumnNames: merged_by
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            indexName: idx_t_customer_merges_surviving
            tableName: t_customer_merges
            columns:
              - column:
                  name: surviving_customer_id
        - createIndex:
            indexName: idx_t_customer_merges_merged
            tableName: t_customer_merges
            columns:
              - column:
                  name: merged_customer_id

  - changeSet:
      id: store-v0100-003-t_customer_contacts
      author: kizuna
      changes:
        - createTable:
            tableName: t_customer_contacts
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_customer_contacts
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: origin_customer_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: value
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
              - column:
                  name: business_status
                  type: VARCHAR(10)
                  defaultValue: UNKNOWN
                  constraints:
                    nullable: false
              - column:
                  name: marketing_status
                  type: VARCHAR(10)
                  defaultValue: UNKNOWN
                  constraints:
                    nullable: false
              - column:
                  name: preferred
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_t_customer_contacts_store
            baseTableName: t_customer_contacts
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_customer_contacts_customer
            baseTableName: t_customer_contacts
            baseColumnNames: customer_id
            referencedTableName: t_customers
            referencedColumnNames: id
            onDelete: NO ACTION
        - addForeignKeyConstraint:
            constraintName: fk_t_customer_contacts_origin
            baseTableName: t_customer_contacts
            baseColumnNames: origin_customer_id
            referencedTableName: t_customers
            referencedColumnNames: id
            onDelete: NO ACTION
        - createIndex:
            tableName: t_customer_contacts
            indexName: idx_t_customer_contacts_owner
            columns:
              - column:
                  name: customer_id

        - sql:
            sql: |
              CREATE INDEX idx_t_customer_contacts_business_denial ON t_customer_contacts(store_id, type, value) INCLUDE (customer_id) WHERE NOT deleted AND business_status = 'DENIED';

  - changeSet:
      id: store-v0100-003-t_customer_contact_history
      author: kizuna
      changes:
        - createTable:
            tableName: t_customer_contact_history
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_customer_contact_history
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: contact_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: origin_customer_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: operation_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: purpose
                  type: VARCHAR(10)
              - column:
                  name: source
                  type: VARCHAR(200)
              - column:
                  name: reason
                  type: VARCHAR(2000)
              - column:
                  name: source_contact_id
                  type: VARCHAR(64)
              - column:
                  name: application_id
                  type: VARCHAR(64)
                  remarks: 同意取得元の申請識別子。原文・取得日時は根拠にも保持する
              - column:
                  name: before_state
                  type: JSONB
              - column:
                  name: after_state
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_t_customer_contact_history_store
            baseTableName: t_customer_contact_history
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_customer_contact_history_contact
            baseTableName: t_customer_contact_history
            baseColumnNames: contact_id
            referencedTableName: t_customer_contacts
            referencedColumnNames: id
            onDelete: NO ACTION
        - addForeignKeyConstraint:
            constraintName: fk_t_customer_contact_history_origin
            baseTableName: t_customer_contact_history
            baseColumnNames: origin_customer_id
            referencedTableName: t_customers
            referencedColumnNames: id
            onDelete: NO ACTION
        - createIndex:
            tableName: t_customer_contact_history
            indexName: idx_t_customer_contact_history_owner
            columns:
              - column:
                  name: contact_id
        - sql:
            sql: |
              CREATE UNIQUE INDEX uq_t_customer_contacts_preferred ON t_customer_contacts(customer_id, type) WHERE preferred AND NOT deleted;
              CREATE INDEX idx_t_customer_contact_history_cursor ON t_customer_contact_history(occurred_at DESC, id DESC);
              ALTER TABLE t_customer_contacts ADD CONSTRAINT ck_t_customer_contacts_type CHECK (type IN ('PHONE', 'EMAIL', 'LINE'));
              ALTER TABLE t_customer_contacts ADD CONSTRAINT ck_t_customer_contacts_deleted CHECK (NOT (deleted AND preferred));
