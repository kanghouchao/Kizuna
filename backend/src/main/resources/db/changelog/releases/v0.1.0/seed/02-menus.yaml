databaseChangeLog:
  - changeSet:
      id: seed-v0100-002-menus
      author: kanghouchao
      # 統合メニューの正典 18 行（2 階層厳守・全ノード permission 非 null）。
      # 親→子の順で挿入し自己参照 FK（fk_t_menus_parent）を満たす。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        # --- プラットフォームコンソール ---
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: platform-main }
              - column: { name: label, value: メイン }
              - column: { name: permission, value: PLATFORM_MENU_VIEW }
              - column: { name: sort_order, valueNumeric: 10 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: platform-dashboard }
              - column: { name: parent_id, value: platform-main }
              - column: { name: label, value: ダッシュボード }
              - column: { name: path, value: /platform/dashboard }
              - column: { name: icon, value: HouseIcon }
              - column: { name: permission, value: PLATFORM_MENU_VIEW }
              - column: { name: sort_order, valueNumeric: 1 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: platform-stores }
              - column: { name: parent_id, value: platform-main }
              - column: { name: label, value: 店舗一覧 }
              - column: { name: path, value: /platform/stores }
              - column: { name: icon, value: BuildingIcon }
              - column: { name: permission, value: STORE_MANAGE }
              - column: { name: sort_order, valueNumeric: 2 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: platform-staff }
              - column: { name: parent_id, value: platform-main }
              - column: { name: label, value: 管理者管理 }
              - column: { name: path, value: /platform/staff }
              - column: { name: icon, value: UsersIcon }
              - column: { name: permission, value: ROLE_MANAGE }
              - column: { name: sort_order, valueNumeric: 3 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: platform-roles }
              - column: { name: parent_id, value: platform-main }
              - column: { name: label, value: ロール管理 }
              - column: { name: path, value: /platform/roles }
              - column: { name: icon, value: KeyRoundIcon }
              - column: { name: permission, value: ROLE_MANAGE }
              - column: { name: sort_order, valueNumeric: 4 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: platform-staff-accounts }
              - column: { name: parent_id, value: platform-main }
              - column: { name: label, value: アカウント管理 }
              - column: { name: path, value: /platform/staff-accounts }
              - column: { name: icon, value: UserCogIcon }
              - column: { name: permission, value: STAFF_ACCOUNT_MANAGE }
              - column: { name: sort_order, valueNumeric: 5 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: platform-settings }
              - column: { name: label, value: 設定 }
              - column: { name: permission, value: PLATFORM_MENU_VIEW }
              - column: { name: sort_order, valueNumeric: 20 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: platform-config }
              - column: { name: parent_id, value: platform-settings }
              - column: { name: label, value: システム設定 }
              - column: { name: path, value: /platform/settings }
              - column: { name: icon, value: SettingsIcon }
              - column: { name: permission, value: SYSTEM_CONFIG_MANAGE }
              - column: { name: sort_order, valueNumeric: 1 }
        # --- 店舗コンソール ---
        # 店舗側は業務の節から始める。着地先はメニュー先頭の業務画面が担うため、
        # 遷移先を持つ子のいない見出しは置かない。
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: store-ops }
              - column: { name: label, value: 業務管理 }
              - column: { name: permission, value: STORE_MENU_VIEW }
              - column: { name: sort_order, valueNumeric: 120 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: store-orders }
              - column: { name: parent_id, value: store-ops }
              - column: { name: label, value: 予約・案件管理 }
              - column: { name: path, value: /store/orders }
              - column: { name: icon, value: ClipboardListIcon }
              - column: { name: permission, value: ORDER_MANAGE }
              - column: { name: sort_order, valueNumeric: 1 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: store-hrm }
              - column: { name: label, value: HRM }
              - column: { name: permission, value: STORE_MENU_VIEW }
              - column: { name: sort_order, valueNumeric: 130 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: store-casts }
