databaseChangeLog:
  - changeSet:
      id: seed-v0100-002-menus
      author: kanghouchao
      # メニューの正典。根はグループと店舗の木（tree）に分かれ、各木はダッシュボードと区分見出しを根に項目を持つ（行は 2 階層）。
      # 木はその木の権限を持つ者にだけ出る。見出しは子に見えるものがあれば出て、項目の権限は項目の木に属す（MenuSeedTreeTests）。
      # 店舗の木のダッシュボードは、店舗のダッシュボード画面ができるまでグループと同じ画面を指す。
      # 見出しは権限の区分（PermissionGroup）で分け、見出し内は日常操作 → 照会・履歴 → 設定の順に並べる。
      # 親→子の順で挿入し自己参照 FK（fk_t_menus_parent）を満たす。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: group-dashboard }
              - column: { name: tree, value: GROUP }
              - column: { name: label, value: ダッシュボード }
              - column: { name: path, value: /admin/dashboard }
              - column: { name: icon, value: HouseIcon }
              - column: { name: sort_order, valueNumeric: 10 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: group-section-business }
              - column: { name: tree, value: GROUP }
              - column: { name: label, value: 業務 }
              - column: { name: sort_order, valueNumeric: 20 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: platform-orders }
              - column: { name: parent_id, value: group-section-business }
              - column: { name: label, value: 受注照会 }
              - column: { name: path, value: /admin/orders }
              - column: { name: icon, value: ClipboardListIcon }
              - column: { name: permission, value: ORDER_SET_VIEW }
              - column: { name: sort_order, valueNumeric: 1 }
        - insert:
            tableName: t_menus
