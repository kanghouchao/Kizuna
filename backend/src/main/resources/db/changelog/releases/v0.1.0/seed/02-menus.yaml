              - column: { name: path, value: /admin/casts }
              - column: { name: icon, value: UsersIcon }
              - column: { name: permission, value: CAST_PERSON_VIEW }
              - column: { name: sort_order, valueNumeric: 1 }
        - insert:
            tableName: t_menus
            columns:
              - column: { name: id, value: group-section-customer }
              - column: { name: tree, value: GROUP }
              - column: { name: label, value: 顧客 }
