databaseChangeLog:
  - changeSet:
      id: platform-v0100-007-member-schema
      author: kanghouchao
      # 会員（Member）。プラットフォーム層の会員身分で、店舗 CRM 台帳（Customer）とは別概念。
      # User（user_type=MEMBER）と 1 対 1 で対応し、来店時に提示する一意の会員コードを持つ。
      # ランクはプラットフォーム級の等級。更新条件（利用回数・付与の純額）が跨店舗の累計である以上、
      # 店舗級には置けない。列の既定は集約の構築時の値と揃えるが、正本は集約側にある。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_members
            remarks: 会員（プラットフォーム層の会員身分。店舗 CRM の顧客とは別概念）
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_members
              - column:
                  name: member_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_t_members_member_code
                  remarks: 来店時に提示する一意の会員コード（数字 12 桁）
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_t_members_user
                  remarks: 会員本人のユーザー（user_type=MEMBER、1 対 1）
              - column:
                  name: rank
                  type: VARCHAR(20)
                  defaultValue: BRONZE
                  constraints:
                    nullable: false
                  remarks: 会員ランク（BRONZE/SILVER/GOLD。跨店舗の累計実績で昇格し降格は無い）
              - column:
                  # 会員退会（終端状態）。退会日時・理由・操作者を同一取引で記録する。退会済みの行は
                  # 残高が常に零で、付与・ランク更新の帰属物化を受けない（ADR 0030）。
                  name: withdrawn_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: 退会日時（未退会は NULL）
              - column:
                  name: withdrawal_reason
                  type: VARCHAR(500)
                  remarks: 退会理由（退会済みの行では必須）
              - column:
                  name: withdrawn_by
                  type: BIGINT
                  remarks: 退会を起こした利用者（本人または職員）
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - addForeignKeyConstraint:
            constraintName: fk_t_members_user
            baseTableName: t_members
            baseColumnNames: user_id
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            # 退会の記録は操作者の行が消えても残す監査系の参照なので SET NULL。
            constraintName: fk_t_members_withdrawn_by
            baseTableName: t_members
            baseColumnNames: withdrawn_by
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
