databaseChangeLog:
  - changeSet:
      id: store-v0100-004-order-schema
      author: kanghouchao
      # 顧客来店の集約は Order（Reservation でも Booking でもない）。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_orders
            remarks: 注文テーブル
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_orders
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: receptionist_id
                  type: BIGINT
                  remarks: 受付担当者 ID（t_users 参照）
              - column:
                  name: customer_id
                  type: VARCHAR(64)
                  remarks: 顧客ID
              - column:
                  name: cast_id
                  type: VARCHAR(64)
                  remarks: キャストID
              - column:
                  name: business_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: 営業日
              - column:
                  name: arrival_scheduled_start_time
                  type: TIME
                  remarks: 到着予定開始時間
              - column:
                  name: arrival_scheduled_end_time
                  type: TIME
                  remarks: 到着予定終了時間
              - column:
                  name: actual_arrival_time
                  type: TIME
                  remarks: 実際の到着時間 (IN)
              - column:
                  name: actual_end_time
                  type: TIME
                  remarks: 実際の終了時間 (OUT)
              - column:
                  name: course_minutes
                  type: INTEGER
                  remarks: コース分数
              - column:
                  name: extension_minutes
                  type: INTEGER
                  defaultValueNumeric: 0
                  remarks: 延長分数
              - column:
                  name: option_codes
                  type: JSONB
                  defaultValueComputed: "'[]'::jsonb"
                  remarks: オプションコード一覧 (JSON Array)
              - column:
                  name: discount_name
                  type: VARCHAR(255)
                  remarks: 割引名
              - column:
                  name: manual_discount
                  type: INTEGER
                  defaultValueNumeric: 0
                  remarks: 手動割引金額
              - column:
                  name: total_fee
                  type: INTEGER
                  defaultValueNumeric: 0
                  remarks: 総額
              - column:
                  name: used_points
                  type: INTEGER
                  defaultValueNumeric: 0
                  remarks: 利用ポイント
              - column:
                  name: auto_grant_points
                  type: INTEGER
                  defaultValueNumeric: 0
                  remarks: 自動付与ポイント
              - column:
                  name: survey_points
                  type: INTEGER
                  defaultValueNumeric: 0
                  remarks: アンケートポイント
              - column:
                  name: survey_status
                  type: VARCHAR(50)
                  defaultValue: UNANSWERED
                  remarks: アンケートステータス
              - column:
                  name: carrier
                  type: VARCHAR(100)
                  remarks: キャリア/Carrier
              - column:
                  name: media_name
                  type: VARCHAR(100)
                  remarks: 媒体名
              - column:
                  name: location_address
                  type: VARCHAR(500)
                  remarks: 派遣先住所
              - column:
                  name: location_building
                  type: VARCHAR(255)
                  remarks: 派遣先建物
              - column:
                  name: remarks
                  type: TEXT
                  remarks: 備考
              - column:
                  name: cast_driver_message
                  type: TEXT
                  remarks: キャスト・ドライバーへのメッセージ
              - column:
                  # すべての受注は確定で出生する（ADR 0017）。未処理の申請は t_order_applications が受ける。
                  name: status
                  type: VARCHAR(50)
                  defaultValue: CONFIRMED
                  remarks: 注文ステータス
              - column:
                  name: pax
                  type: INTEGER
                  remarks: 人数
              - column:
                  name: reception_route
                  type: VARCHAR(20)
                  remarks: 受付経路（WEB=Web 申請/PHONE=電話受付）
              - column:
                  # requester_member_code は申請時点のスナップショットで、会員行が消えて
                  # requester_member_id が欠落した後も誰の申請だったかを読めるようにする。
                  name: requester_member_id
                  type: BIGINT
                  remarks: 申請した会員。会員削除後も履歴を残すため SET NULL
              - column:
                  name: requester_member_code
                  type: VARCHAR(20)
                  remarks: 申請時点の会員コード（会員削除後も申請者を読めるようにするスナップショット）
              - column:
                  # プラットフォーム側プロフィールは店舗へ渡さないため、店舗が知る名前は本人が
                  # その店舗へ名乗ると決めた名前だけ。確定まで台帳行は存在しないので申請の間はこの列が預かる。
                  name: requester_declared_name
                  type: VARCHAR(255)
                  remarks: 申請時に本人が店舗へ名乗った名前（確定時の自動整備で台帳行の氏名になる）
              - column:
                  # 電話番号が台帳で複数顧客に一致すると自動照合を断念して顧客未設定で成立させるため
                  # （ADR 0009）、写しが無いと録入された連絡先がどこにも残らない。
                  name: contact_name
                  type: VARCHAR(255)
                  remarks: 受付で録入された連絡先の氏名（顧客未設定の受注にのみ入る）
              - column:
                  name: contact_phone_number
                  type: VARCHAR(50)
                  remarks: 受付で録入された連絡先の電話番号（顧客未設定の受注にのみ入る）
              - column:
                  # 確定後の取消の記録（ADR 0013）。理由は取消の根拠そのものなので取消では必須
                  # （分類軸ではないため enum 化しない）。
                  name: cancelled_reason
                  type: VARCHAR(500)
                  remarks: 取消の理由。取消していない受注では NULL
              - column:
                  name: cancelled_by
                  type: BIGINT
                  remarks: 取消の実行者。操作者削除後も記録を残すため SET NULL
              - column:
                  name: cancelled_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: 取消の実行時刻
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_store
            baseTableName: t_orders
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_receptionist_platform_user
            baseTableName: t_orders
            baseColumnNames: receptionist_id
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
        # 顧客・キャストへの参照は削除を止める。止める力が同じ RESTRICT ではなく NO ACTION を採る理由は
        # DbConstraint の Javadoc（違反の見え方の差）にある。
        #
        # 顧客への参照は (id, alive) を指す複合外部キーで、「参照先は生きた行」まで DB が守る。
        # 生成列は顧客未設定なら NULL になり、MATCH SIMPLE の既定で無帰属受注は検査対象外に残る。
        # 単列の外部キーは置かない — この制約が存在を含んで強く言うので、二重に張ると同じ違反が
        # どちらの名前で報告されるか定まらず、名前で写す業務例外が揺れる。
        - sql:
            sql: >-
              ALTER TABLE t_orders
              ADD COLUMN customer_alive BOOLEAN
              GENERATED ALWAYS AS (CASE WHEN customer_id IS NULL THEN NULL ELSE true END) STORED
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_customer_alive
            baseTableName: t_orders
            baseColumnNames: customer_id,customer_alive
            referencedTableName: t_customers
            referencedColumnNames: id,alive
            onDelete: NO ACTION
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_cast
            baseTableName: t_orders
            baseColumnNames: cast_id
            referencedTableName: t_casts
            referencedColumnNames: id
            onDelete: NO ACTION
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_requester_member
            baseTableName: t_orders
            baseColumnNames: requester_member_id
            referencedTableName: t_members
            referencedColumnNames: id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_cancelled_by
            baseTableName: t_orders
            baseColumnNames: cancelled_by
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            indexName: idx_t_orders_date
            tableName: t_orders
            columns:
              - column:
                  name: business_date
              - column:
                  name: store_id
        - createIndex:
            indexName: idx_t_orders_customer
            tableName: t_orders
            columns:
              - column:
                  name: customer_id
        - createIndex:
            indexName: idx_t_orders_cast
            tableName: t_orders
            columns:
              - column:
                  name: cast_id
        - createIndex:
            indexName: idx_t_orders_requester_member
            tableName: t_orders
            columns:
              - column:
                  name: requester_member_id
        # 状態別の群読み口（作業キュー・アーカイブ）が引く索引。述語は「store_id = ? かつ
        # status in (...)」でどちらも等値なので先頭 2 列に置け、3 列目の business_date は既定の並び。
        # 他の並び鍵は索引を増やさず、絞り込んだ後の整列に委ねる。
        - createIndex:
            indexName: idx_t_orders_store_status_date
            tableName: t_orders
            columns:
              - column:
                  name: store_id
              - column:
                  name: status
              - column:
                  name: business_date
              - column:
                  name: id
  - changeSet:
      id: store-v0100-004-order-application-schema
      author: kanghouchao
      # 予約申請は受注と別の付随記録（ADR 0017）。店舗の確定で CONFIRMED の受注を生成し order_id を回写する。
      # 会員・ゲスト共用の受け皿（ゲスト入口の追加列はその導入時に拡充する）。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_order_applications
            remarks: 予約申請テーブル
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_order_applications
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  # 終端（CONFIRMED/DECLINED/WITHDRAWN）に入った申請行は以後動かない。失効は状態に
                  # 持たず、希望日経過の PENDING を導出で失効扱いする（バッチ無し）。
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: 申請ステータス（PENDING/CONFIRMED/DECLINED/WITHDRAWN）
              - column:
                  name: business_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: 希望する利用日（営業日）
              - column:
                  name: arrival_scheduled_start_time
                  type: TIME
                  remarks: 希望する到着時刻
              - column:
                  name: pax
                  type: INTEGER
                  remarks: 人数
              - column:
                  name: cast_id
                  type: VARCHAR(64)
                  remarks: 希望する指名キャスト。NULL は指名なし
              - column:
                  name: remarks
                  type: VARCHAR(500)
                  remarks: 申請時の備考・要望
              - column:
                  name: requester_member_id
                  type: BIGINT
                  remarks: 申請した会員。会員削除後も履歴を残すため SET NULL
              - column:
                  name: requester_member_code
                  type: VARCHAR(20)
                  remarks: 申請時点の会員コード（会員削除後も申請者を読めるようにするスナップショット）
              - column:
                  name: requester_declared_name
                  type: VARCHAR(255)
                  remarks: 申請時に本人が店舗へ名乗った名前（確定時の自動整備で台帳行の氏名になる）
              - column:
                  name: declined_reason
                  type: VARCHAR(500)
                  remarks: 謝絶の理由。謝絶していない申請では NULL
              - column:
                  name: processed_by
                  type: BIGINT
                  remarks: 終端遷移（確定・謝絶・取り下げ）の実行者。操作者削除後も記録を残すため SET NULL
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: 終端遷移の実行時刻
              - column:
                  name: order_id
                  type: VARCHAR(64)
                  remarks: 確定時に生成した受注の回写。確定していない申請では NULL
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - addForeignKeyConstraint:
            constraintName: fk_t_order_applications_store
            baseTableName: t_order_applications
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        # 指名キャストへの参照は削除を止める（業務例外へ写像するため NO ACTION — DbConstraint の Javadoc 参照）。
        - addForeignKeyConstraint:
            constraintName: fk_t_order_applications_cast
            baseTableName: t_order_applications
            baseColumnNames: cast_id
            referencedTableName: t_casts
            referencedColumnNames: id
            onDelete: NO ACTION
        - addForeignKeyConstraint:
            constraintName: fk_t_order_applications_requester_member
            baseTableName: t_order_applications
            baseColumnNames: requester_member_id
            referencedTableName: t_members
            referencedColumnNames: id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            constraintName: fk_t_order_applications_processed_by
            baseTableName: t_order_applications
            baseColumnNames: processed_by
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
        # 受注を名指して消す口は無く（ADR 0013）、受注が消えるのは店舗削除の連鎖だけ。そのとき申請行も
        # 同じ連鎖で消えるため、回写の参照は削除を止める宣言でよい（業務例外への写像は持たない）。
        - addForeignKeyConstraint:
            constraintName: fk_t_order_applications_order
            baseTableName: t_order_applications
            baseColumnNames: order_id
            referencedTableName: t_orders
            referencedColumnNames: id
            onDelete: NO ACTION
        # 受付箱の読み口が引く索引。述語は「store_id = ? かつ status in (...)」でどちらも等値なので
        # 先頭 2 列に置け、後続の (business_date, id) は既定の並びそのもの。
        - createIndex:
            indexName: idx_t_order_applications_store_status_date
            tableName: t_order_applications
            columns:
              - column:
                  name: store_id
              - column:
                  name: status
              - column:
                  name: business_date
              - column:
                  name: id
        - createIndex:
            indexName: idx_t_order_applications_cast
            tableName: t_order_applications
            columns:
              - column:
                  name: cast_id
        - createIndex:
            indexName: idx_t_order_applications_requester_member
            tableName: t_order_applications
            columns:
              - column:
                  name: requester_member_id
        - createIndex:
            indexName: idx_t_order_applications_order
            tableName: t_order_applications
            columns:
              - column:
                  name: order_id
