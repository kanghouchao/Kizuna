databaseChangeLog:
  - changeSet:
      id: store-v0100-004-order-schema
      author: kanghouchao
      # 顧客来店の集約は Order（Reservation でも Booking でもない）。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_orders
            remarks: 注文テーブル
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_orders
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: receptionist_id
                  type: BIGINT
                  remarks: 受付担当者 ID（t_users 参照）
              - column:
                  name: customer_id
                  type: VARCHAR(64)
                  remarks: 顧客ID
              - column:
                  name: cast_id
                  type: VARCHAR(64)
                  remarks: キャストID
              - column:
                  name: business_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: 営業日
              - column:
                  name: arrival_scheduled_start_time
                  type: TIME
                  remarks: 到着予定開始時間
              - column:
                  name: arrival_scheduled_end_time
                  type: TIME
                  remarks: 到着予定終了時間
              - column:
                  name: actual_arrival_time
                  type: TIME
                  remarks: 実際の到着時間 (IN)
              - column:
                  name: actual_end_time
                  type: TIME
                  remarks: 実際の終了時間 (OUT)
              - column:
                  # コース名・コース分数・延長分数は「本受注に実際に適用された内容」の写しで、
                  # サービス定義の側から回写されることは無い（充填元が変わっても列は動かない）。
                  name: course_name
                  type: VARCHAR(255)
                  remarks: 適用されたコース名の写し
              - column:
                  name: course_minutes
                  type: INTEGER
                  remarks: コース分数
              - column:
                  name: extension_minutes
                  type: INTEGER
                  defaultValueNumeric: 0
                  remarks: 延長分数
              - column:
                  # 明細（t_order_fee_lines）の帯符号金額の単純総和。手入力の口は無く、
                  # 集約の行為メソッドが行を動かすたびに書き直す導出列。
                  # NOT NULL は下の CHECK を効かせるため — NULL は述語を unknown にして行を通してしまう。
                  name: total_fee
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 会計金額（明細の総和からの導出）
              - column:
                  name: auto_grant_points
                  type: INTEGER
                  defaultValueNumeric: 0
                  remarks: 自動付与ポイント
              - column:
                  name: survey_points
                  type: INTEGER
                  defaultValueNumeric: 0
                  remarks: アンケートポイント
              - column:
                  name: survey_status
                  type: VARCHAR(50)
                  defaultValue: UNANSWERED
                  remarks: アンケートステータス
              - column:
                  name: carrier
                  type: VARCHAR(100)
                  remarks: キャリア/Carrier
              - column:
                  name: media_name
                  type: VARCHAR(100)
                  remarks: 媒体名
              - column:
                  name: location_address
                  type: VARCHAR(500)
                  remarks: 派遣先住所
              - column:
                  name: location_building
                  type: VARCHAR(255)
                  remarks: 派遣先建物
              - column:
                  name: remarks
                  type: TEXT
                  remarks: 備考
              - column:
                  name: cast_driver_message
                  type: TEXT
                  remarks: キャスト・ドライバーへのメッセージ
              - column:
                  # すべての受注は確定で出生する（ADR 0017）。未処理の申請は t_order_applications が受ける。
                  name: status
                  type: VARCHAR(50)
                  defaultValue: CONFIRMED
                  remarks: 注文ステータス
              - column:
                  name: pax
                  type: INTEGER
                  remarks: 人数
              - column:
                  name: reception_route
                  type: VARCHAR(20)
                  remarks: 受付経路（MEMBER_WEB=会員ポータルの申請/GUEST_WEB=公開店面のゲスト申請/PHONE=電話受付）
              - column:
                  # requester_member_code は申請時点のスナップショットで、会員行が消えて
                  # requester_member_id が欠落した後も誰の申請だったかを読めるようにする。
                  name: requester_member_id
                  type: BIGINT
                  remarks: 申請した会員。会員削除後も履歴を残すため SET NULL
              - column:
                  name: requester_member_code
                  type: VARCHAR(20)
                  remarks: 申請時点の会員コード（会員削除後も申請者を読めるようにするスナップショット）
              - column:
                  # プラットフォーム側プロフィールは店舗へ渡さないため、店舗が知る名前は本人が
                  # その店舗へ名乗ると決めた名前だけ。確定まで台帳行は存在しないので申請の間はこの列が預かる。
                  name: requester_declared_name
                  type: VARCHAR(255)
                  remarks: 申請時に本人が店舗へ名乗った名前（確定時の自動整備で台帳行の氏名になる）
              - column:
                  # 電話番号が台帳で複数顧客に一致すると自動照合を断念して顧客未設定で成立させるため
                  # （ADR 0009）、写しが無いと録入された連絡先がどこにも残らない。
                  name: contact_name
                  type: VARCHAR(255)
                  remarks: 受付で録入された連絡先の氏名（顧客未設定の受注にのみ入る）
              - column:
                  name: contact_phone_number
                  type: VARCHAR(50)
                  remarks: 受付で録入された連絡先の電話番号（顧客未設定の受注にのみ入る）
              - column:
                  # 確定後の取消の記録（ADR 0013）。理由は取消の根拠そのものなので取消では必須
                  # （分類軸ではないため enum 化しない）。
                  name: cancelled_reason
                  type: VARCHAR(500)
                  remarks: 取消の理由。取消していない受注では NULL
              - column:
                  name: cancelled_by
                  type: BIGINT
                  remarks: 取消の実行者。操作者削除後も記録を残すため SET NULL
              - column:
                  name: cancelled_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: 取消の実行時刻
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_store
            baseTableName: t_orders
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_receptionist_platform_user
            baseTableName: t_orders
            baseColumnNames: receptionist_id
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
        # 顧客・キャストへの参照は削除を止める。止める力が同じ RESTRICT ではなく NO ACTION を採る理由は
        # DbConstraint の Javadoc（違反の見え方の差）にある。
        #
        # 顧客への参照は (id, alive) を指す複合外部キーで、「参照先は生きた行」まで DB が守る。
        # 生成列は顧客未設定なら NULL になり、MATCH SIMPLE の既定で無帰属受注は検査対象外に残る。
        # 単列の外部キーは置かない — この制約が存在を含んで強く言うので、二重に張ると同じ違反が
        # どちらの名前で報告されるか定まらず、名前で写す業務例外が揺れる。
        - sql:
            sql: >-
              ALTER TABLE t_orders
              ADD COLUMN customer_alive BOOLEAN
              GENERATED ALWAYS AS (CASE WHEN customer_id IS NULL THEN NULL ELSE true END) STORED
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_customer_alive
            baseTableName: t_orders
            baseColumnNames: customer_id,customer_alive
            referencedTableName: t_customers
            referencedColumnNames: id,alive
            onDelete: NO ACTION
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_cast
            baseTableName: t_orders
            baseColumnNames: cast_id
            referencedTableName: t_casts
            referencedColumnNames: id
            onDelete: NO ACTION
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_requester_member
            baseTableName: t_orders
            baseColumnNames: requester_member_id
            referencedTableName: t_members
            referencedColumnNames: id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_cancelled_by
            baseTableName: t_orders
            baseColumnNames: cancelled_by
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
        # 行は負を取れるが総和は取れない。集約が差し替えのたびに同じ判定をするので、ここへ届く違反は
        # 集約を迂回した書き込みだけであり、業務例外へは写像しない（実装欠陥として大きく失敗する）。
        - sql:
            sql: >-
              ALTER TABLE t_orders
              ADD CONSTRAINT ck_t_orders_total_fee_non_negative CHECK (total_fee >= 0)
        - createIndex:
            indexName: idx_t_orders_date
            tableName: t_orders
            columns:
              - column:
                  name: business_date
              - column:
                  name: store_id
        - createIndex:
            indexName: idx_t_orders_customer
            tableName: t_orders
            columns:
              - column:
                  name: customer_id
        - createIndex:
            indexName: idx_t_orders_cast
            tableName: t_orders
            columns:
              - column:
                  name: cast_id
        - createIndex:
            indexName: idx_t_orders_requester_member
            tableName: t_orders
            columns:
              - column:
                  name: requester_member_id
        # 状態別の群読み口（作業キュー・アーカイブ）が引く索引。述語は「store_id = ? かつ
        # status in (...)」でどちらも等値なので先頭 2 列に置け、3 列目の business_date は既定の並び。
        # 他の並び鍵は索引を増やさず、絞り込んだ後の整列に委ねる。
        - createIndex:
            indexName: idx_t_orders_store_status_date
            tableName: t_orders
            columns:
              - column:
                  name: store_id
              - column:
                  name: status
              - column:
                  name: business_date
              - column:
                  name: id
  - changeSet:
      id: store-v0100-004-order-fee-line-schema
      author: kanghouchao
      # 受注金額の内訳は固定列ではなく明細行で持つ。1 行＝種別＋名称の写し＋帯符号金額で、
      # t_orders.total_fee はこの表の単純総和として導出される。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_order_fee_lines
            remarks: 受注明細テーブル
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_order_fee_lines
              - column:
                  name: order_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                  remarks: 親受注
              - column:
                  # 閉集合。ホテル代・交通費・釣銭は受注金額外の回収・精算項目であり、
                  # 種別を持たないことで型の側から排除される。
                  name: kind
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                  remarks: 明細種別（BASE_COURSE/EXTENSION/OPTION/SURCHARGE/DISCOUNT/MANUAL_ADJUST/POINT_REDEMPTION/CREDIT_SURCHARGE）
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: 行が成立した時点の名称の写し
              - column:
                  name: amount
                  type: INTEGER
                  constraints:
                    nullable: false
                  remarks: 帯符号の金額。減項は負値
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        # 明細は受注の構成要素であり、受注が消える唯一の経路（店舗削除の連鎖）で一緒に消える。
        - addForeignKeyConstraint:
            constraintName: fk_t_order_fee_lines_order
            baseTableName: t_order_fee_lines
            baseColumnNames: order_id
            referencedTableName: t_orders
            referencedColumnNames: id
            onDelete: CASCADE
        # 種別ごとの符号約定を DB 側でも塞ぐ。集約が先に同じ判定をするので、ここへ届く違反は
        # 集約を迂回した書き込みだけであり、業務例外へは写像しない（実装欠陥として大きく失敗する）。
        - sql:
            sql: >-
              ALTER TABLE t_order_fee_lines
              ADD CONSTRAINT ck_t_order_fee_lines_amount_sign CHECK (
                CASE kind
                  WHEN 'BASE_COURSE' THEN amount >= 0
                  WHEN 'EXTENSION' THEN amount >= 0
                  WHEN 'OPTION' THEN amount >= 0
                  WHEN 'SURCHARGE' THEN amount >= 0
                  WHEN 'CREDIT_SURCHARGE' THEN amount >= 0
                  WHEN 'DISCOUNT' THEN amount <= 0
                  WHEN 'POINT_REDEMPTION' THEN amount <= 0
                  WHEN 'MANUAL_ADJUST' THEN true
                  ELSE false
                END
              )
        - createIndex:
            indexName: idx_t_order_fee_lines_order
            tableName: t_order_fee_lines
            columns:
              - column:
                  name: order_id
  - changeSet:
      id: store-v0100-004-order-correction-schema
      author: kanghouchao
      # 完了後訂正の痕。1 回の訂正＝1 行で、訂正前の姿を保持する（当日実績の訂正履歴 t_attendance_corrections の拡張）。
      # 標量の前値は列で、行に同一性の無い明細の前値は行集合全体の jsonb 写しで持つ。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_order_corrections
            remarks: 完了後訂正の履歴（訂正前の姿・訂正者・時刻・理由）
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_order_corrections
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                  remarks: 訂正された受注
              - column:
                  # 凍結済みの記録を動かす特権操作なので必須。取消理由と同じく分類軸ではない（enum 化しない）。
                  name: reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                  remarks: 訂正の理由
              - column:
                  name: actual_arrival_time
                  type: TIME
                  remarks: 訂正前の実際の到着時間
              - column:
                  name: actual_end_time
                  type: TIME
                  remarks: 訂正前の実際の終了時間
              - column:
                  name: course_name
                  type: VARCHAR(255)
                  remarks: 訂正前のコース名の写し
              - column:
                  name: course_minutes
                  type: INTEGER
                  remarks: 訂正前のコース分数
              - column:
                  name: extension_minutes
                  type: INTEGER
                  remarks: 訂正前の延長分数
              - column:
                  name: total_fee
                  type: INTEGER
                  remarks: 訂正前の合計。明細の前値から導出できるが、差額の集計が行を展開せずに読めるよう列でも持つ
              - column:
                  # 門が触れない行（ポイント利用）も含む全行。履歴行だけで訂正前の姿が読める形にしておかないと、
                  # 現在の行を突き合わせなければ意味が決まらない記録になる。
                  name: fee_lines
                  type: jsonb
                  constraints:
                    nullable: false
                  remarks: 訂正前の明細の全行（帯符号の金額のまま）
              - column:
                  name: corrected_by
                  type: BIGINT
                  remarks: 訂正の実行者。利用者削除後も行を残すため SET NULL
              - column:
                  name: corrected_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  remarks: 訂正の時刻
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        # 痕は受注の従属記録であり、受注が消える唯一の経路（店舗削除の連鎖）で一緒に消える。
        - addForeignKeyConstraint:
            constraintName: fk_t_order_corrections_store
            baseTableName: t_order_corrections
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_order_corrections_order
            baseTableName: t_order_corrections
            baseColumnNames: order_id
            referencedTableName: t_orders
            referencedColumnNames: id
            onDelete: CASCADE
        # 実行者が消えても痕は残る（取消・帰属無効化と同じ紀律）。
        - addForeignKeyConstraint:
            constraintName: fk_t_order_corrections_corrected_by
            baseTableName: t_order_corrections
            baseColumnNames: corrected_by
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
        # 鎖は受注 1 件ぶんをまとめて古い順に辿る。
        - createIndex:
            indexName: idx_t_order_corrections_order
            tableName: t_order_corrections
            columns:
              - column:
                  name: order_id
  - changeSet:
      id: store-v0100-004-order-application-schema
      author: kanghouchao
      # 予約申請は受注と別の付随記録（ADR 0017）。店舗の確定で CONFIRMED の受注を生成し order_id を回写する。
      # 会員・ゲスト共用の受け皿（ゲスト入口の追加列はその導入時に拡充する）。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_order_applications
            remarks: 予約申請テーブル
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_order_applications
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  # 終端（CONFIRMED/DECLINED/WITHDRAWN）に入った申請行は以後動かない。失効は状態に
                  # 持たず、希望日経過の PENDING を導出で失効扱いする（バッチ無し）。
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: 申請ステータス（PENDING/CONFIRMED/DECLINED/WITHDRAWN）
              - column:
                  name: business_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: 希望する利用日（営業日）
              - column:
                  name: arrival_scheduled_start_time
                  type: TIME
                  remarks: 希望する到着時刻
              - column:
                  name: pax
                  type: INTEGER
                  remarks: 人数
              - column:
                  name: cast_id
                  type: VARCHAR(64)
                  remarks: 希望する指名キャスト。NULL は指名なし
              - column:
                  name: remarks
                  type: VARCHAR(500)
                  remarks: 申請時の備考・要望
              - column:
                  name: requester_member_id
                  type: BIGINT
                  remarks: 申請した会員。会員削除後も履歴を残すため SET NULL
              - column:
                  name: requester_member_code
                  type: VARCHAR(20)
                  remarks: 申請時点の会員コード（会員削除後も申請者を読めるようにするスナップショット）
              - column:
                  name: requester_declared_name
                  type: VARCHAR(255)
                  remarks: 申請時に本人が店舗へ名乗った名前（確定時の自動整備で台帳行の氏名になる）
              - column:
                  # ゲスト申請の連絡先。確定は店舗が折返し連絡で内容を詰める操作なので、この 2 列が
                  # 無いとゲスト申請は処理しようがない。会員申請では NULL（名乗りは上の列が預かる）。
                  name: contact_name
                  type: VARCHAR(255)
                  remarks: ゲスト申請の連絡先氏名。会員申請では NULL
              - column:
                  name: contact_phone_number
                  type: VARCHAR(50)
                  remarks: ゲスト申請の折返し先電話番号。会員申請では NULL
              - column:
                  name: declined_reason
                  type: VARCHAR(500)
                  remarks: 謝絶の理由。謝絶していない申請では NULL
              - column:
                  name: processed_by
                  type: BIGINT
                  remarks: 終端遷移（確定・謝絶・取り下げ）の実行者。操作者削除後も記録を残すため SET NULL
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: 終端遷移の実行時刻
              - column:
                  name: order_id
                  type: VARCHAR(64)
                  remarks: 確定時に生成した受注の回写。確定していない申請では NULL
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
