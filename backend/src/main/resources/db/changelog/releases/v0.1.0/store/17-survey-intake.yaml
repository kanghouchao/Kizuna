            baseTableName: t_survey_history
            baseColumnNames: related_response_id, store_id
            referencedTableName: t_survey_responses
            referencedColumnNames: id, store_id
            constraintName: fk_t_survey_history_related
            onDelete: NO ACTION
        - sql:
            sql: |
              CREATE UNIQUE INDEX uq_t_survey_revisions_draft ON t_survey_revisions(survey_id) WHERE status='DRAFT';
              CREATE UNIQUE INDEX uq_t_survey_revisions_open ON t_survey_revisions(survey_id) WHERE status='OPEN';
              ALTER TABLE t_survey_revisions ADD CONSTRAINT ck_t_survey_revisions_state CHECK (
                revision_number > 0 AND (based_on_revision_id IS NULL OR based_on_revision_id <> id)
                AND ((status='DRAFT' AND opened_at IS NULL AND closed_at IS NULL)
                  OR (status='OPEN' AND opened_at IS NOT NULL AND closed_at IS NULL)
                  OR (status='CLOSED' AND closed_at IS NOT NULL)));
              ALTER TABLE t_survey_responses ADD CONSTRAINT ck_t_survey_responses_state CHECK (
                status IN ('ACTIVE','WITHDRAWN') AND received_via IN ('PAPER','VERBAL','EXISTING_RECORD')
                AND (supersedes_id IS NULL OR supersedes_id <> id)
                AND (superseded_by_id IS NULL OR (superseded_by_id <> id AND status='WITHDRAWN')));
              ALTER TABLE t_survey_operations ADD CONSTRAINT ck_t_survey_operations_target CHECK ((revision_id IS NULL) <> (response_id IS NULL));
              ALTER TABLE t_survey_history ADD CONSTRAINT ck_t_survey_history_target CHECK ((revision_id IS NULL) <> (response_id IS NULL));
              CREATE INDEX idx_t_survey_responses_received ON t_survey_responses(store_id,revision_id,received_at,id);
              CREATE INDEX idx_t_survey_responses_created ON t_survey_responses(store_id,revision_id,created_at,id);
              CREATE INDEX idx_t_survey_history_revision ON t_survey_history(store_id,revision_id,id);
              CREATE INDEX idx_t_survey_history_response ON t_survey_history(store_id,response_id,id);
