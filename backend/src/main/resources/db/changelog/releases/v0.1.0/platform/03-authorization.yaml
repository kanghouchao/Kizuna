databaseChangeLog:
  - changeSet:
      id: platform-v0100-003-rbac-schema
      author: kanghouchao
      # 授権モデル「ロール × 権限」の基座（RBAC）。権限目録はコード定義（PermissionCode enum）を
      # t_permissions へ播種したものが正本で、書き込み API を持たない。ロールは平台既定（is_system）と
      # 利用者自作の 2 種で、担当店舗集合はロールではなくユーザー側（t_user_stores）が持つ。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_roles
            remarks: ロール（権限の束。平台既定ロールは is_system=true で改廃不可）
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_roles
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_t_roles_name
                  remarks: ロールの表示名（自然キー）
              - column:
                  name: is_system
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
                  remarks: 平台既定ロール（true = 名称・権限の変更と削除を拒否）
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - createTable:
            tableName: t_permissions
            remarks: 権限目録（PermissionCode enum 名。播種が唯一の供給経路で書き込み API を持たない）
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_permissions
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_t_permissions_code
                  remarks: 権限コード（PermissionCode enum 名。自然キー）
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - createTable:
            tableName: t_role_permissions
            remarks: ロールが含む権限
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: t_role_permissions
            columnNames: role_id,permission_id
            constraintName: pk_t_role_permissions
        - addForeignKeyConstraint:
            constraintName: fk_t_role_permissions_role
            baseTableName: t_role_permissions
            baseColumnNames: role_id
            referencedTableName: t_roles
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            # 権限目録は播種で固定される正本であり、参照中の削除は授権を黙って失わせるため RESTRICT（fail-loud）。
            constraintName: fk_t_role_permissions_permission
            baseTableName: t_role_permissions
            baseColumnNames: permission_id
            referencedTableName: t_permissions
            referencedColumnNames: id
            onDelete: RESTRICT
        - createTable:
            tableName: t_user_roles
            remarks: ユーザーへのロール授与（STAFF は 1 ロール以上。兼務=複数ロール）
            columns:
              - column:
                  name: platform_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: t_user_roles
            columnNames: platform_user_id,role_id
            constraintName: pk_t_user_roles
        - addForeignKeyConstraint:
            constraintName: fk_t_user_roles_user
            baseTableName: t_user_roles
            baseColumnNames: platform_user_id
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            # 授与中のロールの削除は授権を黙って失わせるため RESTRICT で拒否する（fail-loud）。
            constraintName: fk_t_user_roles_role
            baseTableName: t_user_roles
            baseColumnNames: role_id
            referencedTableName: t_roles
            referencedColumnNames: id
            onDelete: NO ACTION
