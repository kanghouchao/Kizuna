databaseChangeLog:
  - changeSet:
      id: platform-v0100-004-menu-schema
      author: kanghouchao
      # Menu は単一のプラットフォーム集約（店舗次元を持たない）。根はグループか店舗の木（tree）に属し、
      # 木はその木の権限を持つ者にだけ出る。木の中の可視性は permission に置いた PermissionCode 名で決まる。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_menus
            remarks: プラットフォーム統合メニュー（プラットフォーム／店舗コンソール共通の単一 Menu 集約）
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_menus
              - column:
                  name: parent_id
                  type: VARCHAR(64)
                  remarks: 親メニュー（NULL = 木の根の節。階層は 2 段まで）
              - column:
                  name: tree
                  type: VARCHAR(16)
                  remarks: 根の節が属する木（GROUP / STORE = PermissionTree）。子は親の木に属し NULL
              - column:
                  name: label
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                  remarks: 表示ラベル
              - column:
                  name: path
                  type: VARCHAR(255)
                  remarks: 遷移先パス（グループ根は NULL）
              - column:
                  name: icon
                  type: VARCHAR(50)
                  remarks: アイコン名（lucide-react のエクスポート名）
              - column:
                  name: permission
                  type: VARCHAR(100)
                  remarks: 可視化に必要な権限（PermissionCode 名）
              - column:
                  name: sort_order
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 表示順
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - addForeignKeyConstraint:
            constraintName: fk_t_menus_parent
            baseTableName: t_menus
            baseColumnNames: parent_id
            referencedTableName: t_menus
            referencedColumnNames: id
            onDelete: CASCADE
        # 木は根だけが持つ。子に木を持たせると親の木と食い違う行が書けるため、根と子で列の有無を固定する。
        - sql:
            sql: >-
              ALTER TABLE t_menus
              ADD CONSTRAINT ck_t_menus_tree CHECK (
                (parent_id IS NULL AND tree IN ('GROUP', 'STORE'))
                OR (parent_id IS NOT NULL AND tree IS NULL))
