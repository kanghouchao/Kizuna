databaseChangeLog:
  - changeSet:
      id: platform-v0100-010-point-ledger-schema
      author: kanghouchao
      # 会員ポイント台帳。追加型で、訂正も取消も新しい行として積み既存行は書き換えない。残高は行の合計として
      # 都度求めるため、残高列は持たない。会員はプラットフォーム級の身分なので台帳も店舗で分割せず、
      # originating_store_id は「どの店舗で起きたか」の帰属だけを表す（store_id という名は作用域を意味するため使わない）。
      # t_point_usage_allocations は減算 1 件がどの加算ロットを消費したかの明細で、消費済み量はこの表の
      # source_entry_id 別合計だけで求まる。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_point_entries
            remarks: 会員ポイント台帳の仕訳（追加型。残高は行の合計）
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_point_entries
              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
                  remarks: 台帳の持ち主である会員
              - column:
                  name: entry_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                  remarks: 仕訳種別（ORDER_GRANT/USE/MANUAL_ADJUST/CANCEL/EXPIRE/WITHDRAWAL_CLEAR）
              - column:
                  name: amount
                  type: INTEGER
                  constraints:
                    nullable: false
                  remarks: 符号付きの増減。加算は正、減算は負で 0 は取らない
              - column:
                  name: expires_on
                  type: DATE
                  remarks: 加算ロットの有効期限。期限なしと減算は NULL
              - column:
                  name: originating_store_id
                  type: BIGINT
                  remarks: 発生店舗（帰属情報。残高の作用域ではなく、店舗を跨いだ利用も成立する）
              - column:
                  name: order_id
                  type: VARCHAR(64)
                  remarks: 付与・利用の元になった受注
              - column:
                  name: original_entry_id
                  type: BIGINT
                  remarks: 取消対象の加算仕訳。CANCEL のみ設定される
              - column:
                  name: actor_user_id
                  type: BIGINT
                  remarks: 仕訳を起こした操作者。機構が起こす失効では NULL
              - column:
                  name: reason
                  type: VARCHAR(500)
                  remarks: 手動調整の理由（MANUAL_ADJUST では必須）
              - column:
                  # 応答喪失後の再送が台帳へ二重記帳されるのを、クライアント生成キーの一意制約で
                  # 機構的に遮断する（ADR 0007）。PostgreSQL の UNIQUE は NULL 同士を別値と見るため
                  # 部分インデックスは不要。
                  name: idempotency_key
                  type: VARCHAR(64)
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_t_point_entries_idempotency_key
                  remarks: 手動調整の冪等キー（クライアント生成。手動調整以外は NULL。値を持つ行は一意）
              - column:
                  # 誤帰属の訂正として積んだ手動調整が、どの帰属記録を訂正したのかを指し返す（ADR 0012）。
                  # 減算は期限の早いロットから引く引き当てで誤付与ロットを狙い撃ちにしないため、この列が
                  # 無いと訂正の由来を機械的に辿れず、同じ帰属記録への訂正累計の上限判定も成立しない。
                  name: corrected_attribution_id
                  type: BIGINT
                  remarks: 訂正した帰属記録（誤帰属の訂正のみ。通常の手動調整は NULL）
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - createTable:
            tableName: t_point_usage_allocations
            remarks: 減算仕訳がどの加算ロットから引き当てたかの明細
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_point_usage_allocations
              - column:
                  name: entry_id
                  type: BIGINT
                  constraints:
                    nullable: false
                  remarks: 引き当てを行った減算仕訳
              - column:
                  name: source_entry_id
                  type: BIGINT
                  constraints:
                    nullable: false
                  remarks: 引き当て元の加算仕訳（ロット）
              - column:
                  name: amount
                  type: INTEGER
                  constraints:
                    nullable: false
                  remarks: 引き当て量（常に正）
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - addForeignKeyConstraint:
            constraintName: fk_t_point_entries_member
            baseTableName: t_point_entries
            baseColumnNames: member_id
            referencedTableName: t_members
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_point_entries_store
            baseTableName: t_point_entries
            baseColumnNames: originating_store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            constraintName: fk_t_point_entries_order
            baseTableName: t_point_entries
            baseColumnNames: order_id
            referencedTableName: t_orders
            referencedColumnNames: id
            onDelete: SET NULL
        # 取消の連鎖は禁止する。仕訳は消さない前提なので削除は起きないが、起きたときに取消の指し先だけが
        # 静かに消えて「何を取り消したか分からない行」が残るのを防ぐ。
        - addForeignKeyConstraint:
            constraintName: fk_t_point_entries_original
            baseTableName: t_point_entries
            baseColumnNames: original_entry_id
            referencedTableName: t_point_entries
            referencedColumnNames: id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            constraintName: fk_t_point_entries_actor
            baseTableName: t_point_entries
            baseColumnNames: actor_user_id
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
        # 店舗削除は受注を消し、帰属記録も CASCADE で消えるが、会員の残高と仕訳履歴はグループ
        # 資産として残らなければならない（ADR 0006）。CASCADE では台帳行が道連れになり、
        # RESTRICT では帰属記録が店舗削除を塞ぐ。指し先を失った訂正行は指し返しだけを失う。
        - addForeignKeyConstraint:
            constraintName: fk_t_point_entries_corrected_attribution
            baseTableName: t_point_entries
            baseColumnNames: corrected_attribution_id
            referencedTableName: t_order_attributions
            referencedColumnNames: id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            constraintName: fk_t_point_usage_allocations_entry
            baseTableName: t_point_usage_allocations
            baseColumnNames: entry_id
            referencedTableName: t_point_entries
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_t_point_usage_allocations_source
            baseTableName: t_point_usage_allocations
            baseColumnNames: source_entry_id
            referencedTableName: t_point_entries
            referencedColumnNames: id
            onDelete: CASCADE
        # 増減 0 の仕訳と 0 以下の引き当ては台帳の意味を壊すため DB 側でも塞ぐ。
        - sql:
            sql: >-
              ALTER TABLE t_point_entries
              ADD CONSTRAINT ck_t_point_entries_amount_nonzero CHECK (amount <> 0)
        - sql:
            sql: >-
              ALTER TABLE t_point_usage_allocations
              ADD CONSTRAINT ck_t_point_usage_allocations_amount_positive CHECK (amount > 0)
        - createIndex:
            indexName: idx_t_point_entries_member_expires
            tableName: t_point_entries
            columns:
              - column:
                  name: member_id
              - column:
                  name: expires_on
        - createIndex:
            indexName: idx_t_point_entries_member_created
            tableName: t_point_entries
            columns:
              - column:
                  name: member_id
              - column:
                  name: created_at
        - createIndex:
            indexName: idx_t_point_entries_order
            tableName: t_point_entries
            columns:
              - column:
                  name: order_id
        - createIndex:
            indexName: idx_t_point_usage_allocations_source
            tableName: t_point_usage_allocations
            columns:
              - column:
                  name: source_entry_id
        # 訂正の読み口も書き込みの上限判定もこの列で台帳を集計する。PostgreSQL は参照側の外部キー列に
        # 索引を作らないので、無いとグループ全体の追記型台帳を毎回走査することになる。
        # 値を持つのは訂正の仕訳だけなので部分索引にする。
        - sql:
            sql: >-
              CREATE INDEX idx_t_point_entries_corrected_attribution
              ON t_point_entries (corrected_attribution_id)
              WHERE corrected_attribution_id IS NOT NULL
