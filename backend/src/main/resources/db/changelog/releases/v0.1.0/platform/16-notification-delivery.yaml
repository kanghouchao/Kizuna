databaseChangeLog:
  - changeSet:
      id: platform-v0100-016-notification-delivery
      author: kanghouchao
      # 業務を跨ぐ唯一の送信正本。attributed_store_id は「どの店舗の通知か」の帰属だけを表し、会員宛のグループ級の行で
      # null になる（store_id という名は作用域を意味するため使わない）。起点は（source_type, source_id）の多態参照で
      # 外部キーを張らず、用途・チャネルの値はコードの enum が正本なので check で列挙しない。
      changes:
        - createTable:
            tableName: t_notification_deliveries
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_notification_deliveries
              - column:
                  name: attributed_store_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: source_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: source_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: channel
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: purpose
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: VARCHAR(10000)
                  constraints:
                    nullable: false
              - column:
                  name: scheduled_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: dedupe_key
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: attempt_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(500)
        - createTable:
            tableName: t_notification_attempts
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_notification_attempts
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: delivery_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: attempt_number
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: task_execution_id
                  type: BIGINT
              - column:
                  name: actor_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: actor_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: finished_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: failure_code
                  type: VARCHAR(40)
        # 店舗削除は帰属する通知を連鎖削除する（SET NULL ではグループ級の行に化けるため）。試行は通知に従い、
        # 実行主体（サービス ID または判定した職員）と定期処理の実行記録は履歴のため保護する。
        - addForeignKeyConstraint:
            baseTableName: t_notification_deliveries
            baseColumnNames: attributed_store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            constraintName: fk_t_notification_deliveries_attributed_store_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: t_notification_attempts
            baseColumnNames: delivery_id
            referencedTableName: t_notification_deliveries
            referencedColumnNames: id
            constraintName: fk_t_notification_attempts_delivery_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: t_notification_attempts
            baseColumnNames: task_execution_id
            referencedTableName: t_execution_attempts
            referencedColumnNames: id
            constraintName: fk_t_notification_attempts_task_execution_id
            onDelete: NO ACTION
        - addForeignKeyConstraint:
            baseTableName: t_notification_attempts
            baseColumnNames: actor_user_id
            referencedTableName: t_users
            referencedColumnNames: id
            constraintName: fk_t_notification_attempts_actor_user_id
            onDelete: NO ACTION
        - addUniqueConstraint:
            tableName: t_notification_attempts
            columnNames: delivery_id,attempt_number
            constraintName: uq_t_notification_attempts_number
        # 要求キーはグループ級（null）の行どうしでも重複させないため NULLS NOT DISTINCT にする。
        # 定期処理の実行を持たない試行は職員の判定だけで、判定は送達済みか未送達のどちらかに限る。
        - sql:
            sql: |
              CREATE UNIQUE INDEX uq_t_notification_deliveries_key ON t_notification_deliveries (attributed_store_id,dedupe_key) NULLS NOT DISTINCT;
              ALTER TABLE t_notification_deliveries ADD CONSTRAINT ck_t_notification_deliveries_status CHECK (status IN ('DRAFT','QUEUED','DISPATCHED','SENDING','SENT','FAILED','BLOCKED','UNKNOWN'));
              ALTER TABLE t_notification_attempts ADD CONSTRAINT ck_t_notification_attempts_status CHECK (status IN ('DISPATCHED','SENDING','SENT','FAILED','BLOCKED','UNKNOWN'));
              ALTER TABLE t_notification_attempts ADD CONSTRAINT ck_t_notification_attempts_manual_resolution CHECK ((task_execution_id IS NULL) = (failure_code IS NOT DISTINCT FROM 'MANUAL_RESOLUTION') AND (task_execution_id IS NOT NULL OR status IN ('SENT','FAILED')));
              CREATE INDEX idx_t_notification_deliveries_due ON t_notification_deliveries (scheduled_at,id) WHERE status = 'QUEUED';
              CREATE INDEX idx_t_notification_deliveries_history ON t_notification_deliveries (attributed_store_id,id DESC);
              CREATE INDEX idx_t_notification_attempts_history ON t_notification_attempts (delivery_id,id DESC);
