databaseChangeLog:
  - changeSet:
      id: platform-v0100-002-user-schema
      author: kanghouchao
      # プラットフォーム共通ユーザー（User）。身分は全プラットフォーム級で、
      # データの見える範囲は「授権店舗集合（StoreScope）」で決まる。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_users
            remarks: プラットフォーム共通ユーザー（ロール × 授権店舗集合で授権する）
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_users
              - column:
                  # 資格情報の 2 列が NULL 可なのは本人種別 SERVICE のため。列に値が無いことが
                  # 「サービスIDは対話ログインしない」の構造上の根拠で、種別ごとの要否は
                  # User の不変条件が守る。一意性は下の部分一意索引（未退会の行だけ）が担う。
                  name: email
                  type: VARCHAR(255)
                  remarks: ログイン ID を兼ねるメールアドレス（SERVICE は NULL。未退会の行で一意）
              - column:
                  name: password
                  type: VARCHAR(255)
                  remarks: bcrypt ハッシュ（SERVICE は NULL）
              - column:
                  # 資格情報の版（ADR 0022）。パスワード変更・再設定・停止で単調増分し、
                  # 発行済み JWT の claim と相等比較してセッションを即時失効させる。
                  name: credential_version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 資格情報の版（単調増分。楽観ロックの version とは別）
              - column:
                  name: display_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                  remarks: 表示名
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
                  remarks: 有効フラグ（false = 停止中）
              - column:
                  name: user_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: 本人種別（STAFF/SERVICE/CAST/MEMBER）
              - column:
                  name: store_scope_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: 授権店舗範囲種別（ALL_STORES / SPECIFIC_STORES）
              - column:
                  # 1 つの LINE アカウントが複数の身分に結び付くと、なりすまし経路になるため一意
                  # （未退会の行の間で。下の部分一意索引）。
                  name: line_user_id
                  type: VARCHAR(64)
                  remarks: 連携済み LINE ユーザー ID（未連携は NULL。未退会の行で一意）
              - column:
                  # 会員退会の終端状態（ADR 0029）。退会した行は電子メール・LINE ID を保持したまま残り、
                  # 認証・重複確認・LINE 連携の候補から外れる。停止（enabled）とは別の状態。
                  name: withdrawn_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: 退会日時（未退会は NULL）
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        # 一意性は未退会の行だけに掛ける（ADR 0029）。退会した行が識別子を占有し続けると同じ電子メールで
        # 再登録できない。Liquibase OSS は述語付き一意索引を宣言できないため素の SQL で作る。
        # 索引名は DbConstraint が業務例外へ写像する字面なので変えない。
        - sql:
            sql: >-
              CREATE UNIQUE INDEX uq_t_users_email
              ON t_users (email) WHERE withdrawn_at IS NULL
        - sql:
            sql: >-
              CREATE UNIQUE INDEX uq_t_users_line_user_id
              ON t_users (line_user_id) WHERE withdrawn_at IS NULL
        - createTable:
            tableName: t_user_stores
            remarks: 授権店舗集合（store_scope_type=SPECIFIC_STORES 時のみ行を持つ）
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: t_user_stores
            columnNames: user_id,store_id
            constraintName: pk_t_user_stores
        - addForeignKeyConstraint:
            constraintName: fk_t_user_stores_user
            baseTableName: t_user_stores
            baseColumnNames: user_id
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            # 店舗削除には全店舗スコープ表が CASCADE で従う。残存する空集合は
            # authorizes() が全 false になる fail-closed 挙動。
            constraintName: fk_t_user_stores_store
            baseTableName: t_user_stores
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE
