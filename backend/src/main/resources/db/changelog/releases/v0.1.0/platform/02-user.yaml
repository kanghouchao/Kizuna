databaseChangeLog:
  - changeSet:
      id: platform-v0100-002-user-schema
      author: kanghouchao
      # プラットフォーム共通ユーザー（PlatformUser）。身分は全プラットフォーム級で、
      # データの見える範囲は「授権店舗集合（StoreScope）」で決まる。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_users
            remarks: プラットフォーム共通ユーザー（ロール × 授権店舗集合で授権する）
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_users
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_t_users_email
                  remarks: ログイン ID を兼ねるメールアドレス
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: bcrypt ハッシュ
              - column:
                  # 資格情報の版（ADR 0022）。パスワード変更・再設定・停止で単調増分し、
                  # 発行済み JWT の claim と相等比較してセッションを即時失効させる。
                  name: credential_version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 資格情報の版（単調増分。楽観ロックの version とは別）
              - column:
                  name: display_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                  remarks: 表示名
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
                  remarks: 有効フラグ（false = 停止中）
              - column:
                  name: user_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: 本人種別（STAFF/CAST/MEMBER）
              - column:
                  name: store_scope_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: 授権店舗範囲種別（ALL_STORES / SPECIFIC_STORES）
              - column:
                  # 1 つの LINE アカウントが複数の身分に結び付くと、なりすまし経路になるため一意。
                  name: line_user_id
                  type: VARCHAR(64)
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_t_users_line_user_id
                  remarks: 連携済み LINE ユーザー ID（未連携は NULL。値を持つ行は一意）
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        - createTable:
            tableName: t_user_stores
            remarks: 授権店舗集合（store_scope_type=SPECIFIC_STORES 時のみ行を持つ）
            columns:
              - column:
                  name: platform_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: t_user_stores
            columnNames: platform_user_id,store_id
            constraintName: pk_t_user_stores
        - addForeignKeyConstraint:
            constraintName: fk_t_user_stores_user
            baseTableName: t_user_stores
            baseColumnNames: platform_user_id
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            # 店舗削除には全店舗スコープ表が CASCADE で従う。残存する空集合は
            # authorizes() が全 false になる fail-closed 挙動。
            constraintName: fk_t_user_stores_store
            baseTableName: t_user_stores
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: platform-v0100-002-emergency-elevation-schema
      author: kanghouchao
      # 緊急昇格 1 回分の記録。1 発動 1 行の追記型で、再発動は新しい行になる（書き換えも削除もしない）。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createTable:
            tableName: t_emergency_elevations
            remarks: 緊急昇格の発動 1 回分の記録（追記型。再発動は新しい行）
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_emergency_elevations
              - column:
                  name: activated_by
                  type: BIGINT
                  constraints:
                    nullable: false
                  remarks: 昇格を発動した操作者
              - column:
                  # 行分離の作用域ではなく昇格の宛先。列名が store_id でないのはその宣言でもある
                  # （店舗行分離機構に載る表ではない）。
                  name: target_store_id
                  type: BIGINT
                  constraints:
                    nullable: false
                  remarks: 昇格が及ぶ唯一の店舗
              - column:
                  # 迂回の根拠そのものなので必須（分類軸ではないため enum 化しない）。
                  name: reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                  remarks: 発動の理由（必須）
              - column:
                  # 監査の復元はこの 2 列を基準にする。created_at は行の書き込み時刻でしかなく、
                  # 昇格が効いていた区間の正本にはできない。
                  name: activated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  remarks: 発動した日時
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  remarks: 昇格の期限（発動から 60 分）
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: 記録の状態（ACTIVE=有効 / REVOKED=撤回済み）
              - column:
                  name: revoked_by
                  type: BIGINT
                  remarks: 撤回を実行した操作者（撤回時は必須。有効な記録では NULL）
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: 撤回した日時
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: 楽観ロック用バージョン
        # 操作者は停止しても行が消えないため、削除を拒む NO ACTION で足りる。SET NULL に倒すと
        # 「誰が迂回したか」を欠いた記録が残り、監査の目的そのものが失われる。
        - addForeignKeyConstraint:
            constraintName: fk_t_emergency_elevations_activated_by
            baseTableName: t_emergency_elevations
            baseColumnNames: activated_by
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: NO ACTION
        - addForeignKeyConstraint:
            constraintName: fk_t_emergency_elevations_revoked_by
            baseTableName: t_emergency_elevations
            baseColumnNames: revoked_by
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: NO ACTION
        # 発動記録は監査の正本であり、誤登録の撤回（店舗削除）にも従わせない。拒否は
        # DbConstraint 写像が業務例外へ落とす（NO ACTION なので制約名が報告される）。
        - addForeignKeyConstraint:
            constraintName: fk_t_emergency_elevations_store
            baseTableName: t_emergency_elevations
            baseColumnNames: target_store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            onDelete: NO ACTION
        # 参照側は自動では索引されない。店舗削除時の逆参照検査が追記型の全表走査にならないようにする。
        - createIndex:
            indexName: idx_t_emergency_elevations_target_store
            tableName: t_emergency_elevations
            columns:
              - column:
                  name: target_store_id
        # 撤回時の「同じ発動者のまだ有効な発動」の読み口。表は追記型で増え続けるため走査に載せない。
        - createIndex:
            indexName: idx_t_emergency_elevations_activator_live
            tableName: t_emergency_elevations
            columns:
              - column:
                  name: activated_by
              - column:
                  name: status
              - column:
                  name: expires_at
