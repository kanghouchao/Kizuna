databaseChangeLog:
  - changeSet:
      id: store-v0100-021-media
      author: kizuna
      # 媒体 = 広告費・受注・応募者が同じ媒体を指すための店舗ごとの一覧。参照元は (id, store_id) の
      # 複合 FK で同一店舗を保証し、名前は前後の空白を除いた原文のまま店舗内で一意にする。
      changes:
        - createTable:
            tableName: t_media
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_t_media
              - column:
                  name: store_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        # 媒体は店舗の所有物であり、店舗削除の連鎖で一緒に消える。
        - addForeignKeyConstraint:
            baseTableName: t_media
            baseColumnNames: store_id
            referencedTableName: t_stores
            referencedColumnNames: id
            constraintName: fk_t_media_store_id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: t_media
            columnNames: store_id, name
            constraintName: uq_t_media_store_name
        - addUniqueConstraint:
            tableName: t_media
            columnNames: id, store_id
            constraintName: uq_t_media_id_store
        - sql:
            sql: |
              ALTER TABLE t_media ADD CONSTRAINT ck_t_media_values CHECK (status IN ('ACTIVE','STOPPED') AND name = btrim(name) AND name <> '');
