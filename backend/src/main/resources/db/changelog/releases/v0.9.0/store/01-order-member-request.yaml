databaseChangeLog:
  - changeSet:
      id: store-v0900-001-order-member-request
      author: kanghouchao
      # 会員ポータルからの予約申請を受注（Order）そのものとして受け入れるための列。
      # 申請は status=CREATED かつ reception_route=WEB で表し、店舗の確定で同じ行が CONFIRMED になる
      # ため、申請と確定受注の対応は行の同一性がそのまま担保する。
      # requester_member_code は申請時点のスナップショットで、会員行が消えて requester_member_id が
      # 欠落した後も誰の申請だったかを読めるようにする。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - addColumn:
            tableName: t_orders
            columns:
              - column:
                  name: pax
                  type: INTEGER
                  remarks: 人数
              - column:
                  name: reception_route
                  type: VARCHAR(20)
                  remarks: 受付経路（WEB=Web 申請/PHONE=電話受付）
              - column:
                  name: requester_member_id
                  type: BIGINT
                  remarks: 申請した会員。会員削除後も履歴を残すため SET NULL
              - column:
                  name: requester_member_code
                  type: VARCHAR(20)
                  remarks: 申請時点の会員コード（会員削除後も申請者を読めるようにするスナップショット）
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_requester_member
            baseTableName: t_orders
            baseColumnNames: requester_member_id
            referencedTableName: t_members
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            indexName: idx_t_orders_requester_member
            tableName: t_orders
            columns:
              - column:
                  name: requester_member_id
      rollback:
        - dropIndex:
            indexName: idx_t_orders_requester_member
            tableName: t_orders
        - dropForeignKeyConstraint:
            constraintName: fk_t_orders_requester_member
            baseTableName: t_orders
        - dropColumn:
            tableName: t_orders
            columns:
              - column:
                  name: pax
              - column:
                  name: reception_route
              - column:
                  name: requester_member_id
              - column:
                  name: requester_member_code
