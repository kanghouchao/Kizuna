databaseChangeLog:
  - changeSet:
      id: store-v02200-001-order-cancellation-record
      author: kanghouchao
      # 確定後の取消の記録。理由は取消の根拠そのものなので取消では必須（分類軸ではないため enum 化しない）。
      # 実行者は帰属記録の invalidated_by と同じ紀律で、操作者の削除後も取消の記録を残すため SET NULL。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - addColumn:
            tableName: t_orders
            columns:
              - column:
                  name: cancelled_reason
                  type: VARCHAR(500)
                  remarks: 取消の理由。取消していない受注では NULL
              - column:
                  name: cancelled_by
                  type: BIGINT
                  remarks: 取消の実行者。操作者削除後も記録を残すため SET NULL
              - column:
                  name: cancelled_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: 取消の実行時刻
        - addForeignKeyConstraint:
            constraintName: fk_t_orders_cancelled_by
            baseTableName: t_orders
            baseColumnNames: cancelled_by
            referencedTableName: t_users
            referencedColumnNames: id
            onDelete: SET NULL
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: t_orders
            constraintName: fk_t_orders_cancelled_by
        - dropColumn:
            tableName: t_orders
            columnName: cancelled_reason
        - dropColumn:
            tableName: t_orders
            columnName: cancelled_by
        - dropColumn:
            tableName: t_orders
            columnName: cancelled_at
