databaseChangeLog:
  - changeSet:
      id: store-v02200-002-order-queue-index
      author: kanghouchao
      # 状態別の群読み口（作業キュー・アーカイブ）が引く索引。3 群とも述語は
      # 「store_id = ? かつ status in (...)」で、どちらも等値なので先頭 2 列に置ける
      # （store_id は storeFilter が WHERE へ足す）。既存の索引は先頭が business_date か
      # customer_id / cast_id で、この述語には効かない。
      #
      # 3 列目に business_date を置くのは既定の並びだから。他の 3 つの鍵（到着時刻・人数・
      # コース時間）は索引を増やさず、絞り込んだ後の整列に委ねる — 受注は 1 件の操作ごとに
      # 書かれる表で、鍵ごとに索引を足すとその書き込みすべてに費用が付く。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - createIndex:
            indexName: idx_t_orders_store_status_date
            tableName: t_orders
            columns:
              - column:
                  name: store_id
              - column:
                  name: status
              - column:
                  name: business_date
              - column:
                  name: id
      rollback:
        - dropIndex:
            tableName: t_orders
            indexName: idx_t_orders_store_status_date
