databaseChangeLog:
  - changeSet:
      id: store-v0600-001-shift-request-change
      author: kanghouchao
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - addColumn:
            tableName: t_shift_requests
            columns:
              - column:
                  name: request_type
                  type: VARCHAR(20)
                  defaultValue: NEW
                  constraints:
                    nullable: false
                  remarks: 種別（NEW=新規希望/CHANGE=確定シフトへの変更申請）
              - column:
                  name: shift_id
                  type: VARCHAR(64)
                  remarks: 変更申請（CHANGE）の対象シフト id。NEW では NULL。対象シフト削除時も申請は履歴として残すため SET NULL
              - column:
                  name: original_work_date
                  type: DATE
                  remarks: 変更申請時点の対象シフト勤務日（申請後の変更検知用。NEW では NULL）
              - column:
                  name: original_start_time
                  type: TIME
                  remarks: 変更申請時点の対象シフト開始時刻（NEW では NULL）
              - column:
                  name: original_end_time
                  type: TIME
                  remarks: 変更申請時点の対象シフト終了時刻（NEW では NULL）
        - addForeignKeyConstraint:
            constraintName: fk_t_shift_requests_shift
            baseTableName: t_shift_requests
            baseColumnNames: shift_id
            referencedTableName: t_shifts
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            indexName: idx_t_shift_requests_shift
            tableName: t_shift_requests
            columns:
              - column:
                  name: shift_id
