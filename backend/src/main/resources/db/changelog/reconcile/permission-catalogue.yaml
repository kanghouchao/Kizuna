databaseChangeLog:
  - changeSet:
      id: reconcile-permission-catalogue
      author: kanghouchao
      runAlways: true
      # 権限目録（t_permissions）・既定ロールの行・既定ロールへの授与を PermissionCode / SystemRole の
      # 宣言から取り直す。目録行と既定授与を changeset へ手書きする形は「enum に足したが播種を忘れた」
      # 齟齬を許すため、宣言を唯一の源にしてこの欠陥類を構造的に閉じる。以後の権限追加は enum への
      # 追加のみで足りる。
      # 既定ロールの授与は宣言との完全な写像にする（不足を挿し、宣言に無いものを取り消す）。取り下げを
      # 別の一度きりの changeset に委ねると、毎回走る本 changeset が次の起動で挿し戻してしまうため。
      # 既定ロールの行も本 changeset が用意する（版付き migration に任せると、その release より先に
      # 走った回で「まだ存在しないロール」を見てしまう）。
      # 目録行は挿入のみ（廃止は自作ロールの権限を落とす判断を伴うので明示的な移行 changeset に属する）。
      # 本 changeset は版に属さないため releases/ ではなく reconcile/ に置き、master では全 release の
      # 後に include する（ロールの改名のような release 側の移行を、取り直しより先に効かせるため）。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - customChange:
            class: com.kizuna.user.infrastructure.PermissionCatalogueSeed
