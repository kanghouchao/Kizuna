databaseChangeLog:
  - changeSet:
      id: reconcile-permission-catalogue
      author: kanghouchao
      runAlways: true
      # 権限目録（t_permissions）と既定ロールの行を PermissionCode / SystemRole の宣言から取り直す。目録行は挿入のみ
      # （廃止は自作ロールの権限を落とす判断を伴うので明示的な移行 changeset に属する）。
      # 既定ロールへの授与は、ロール行をこの回に初めて作った場合だけ宣言の defaultRoles を播種する。既定ロールの権限は
      # 管理者が編集できるため、既存行の授与を取り直すと運用の編集を黙って巻き戻してしまう。新しい DB の既定授与は
      # 基線 seed（seed/01-roles.yaml）が決め、宣言との一致は PermissionSeedLiteralTests が機械検証する。
      # 本 changeset は版に属さないため releases/ ではなく reconcile/ に置き、master では全 release の
      # 後に include する。
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - customChange:
            class: com.kizuna.user.infrastructure.PermissionCatalogueSeed
