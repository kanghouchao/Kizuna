# 実行環境ごとの値は Spring Boot の環境変数名（SPRING_DATASOURCE_URL、APP_JWT_SECRET など、プロパティ名を大文字・アンダースコアにしたもの）で
# 上書きする。ここには既定値だけを書き、独自の変数名へのプレースホルダは置かない。
spring:
  application:
    name: Kizuna
  datasource:
    url: jdbc:postgresql://localhost:5432/kizuna?sslmode=disable
    username: user
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 2000
      validation-timeout: 5000
      initialization-fail-timeout: -1
      connection-test-query: SELECT 1
  # SMTP の待ちの上限（ミリ秒）。JavaMail の既定は無制限で、検証メールはコミット後・応答前に同期で送るため、
  # 応答の遅い SMTP が要求スレッドと DB 接続を握り続ける。DB の SMTP 設定で組む送信クライアントにも同じ値を使う（MailService）。
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
      # SPRING_MAIL_PROTOCOL=smtps のとき JavaMail は mail.smtps.* を読む。DB の SMTP 設定は常に smtp。
      "[mail.smtps.connectiontimeout]": 5000
      "[mail.smtps.timeout]": 10000
      "[mail.smtps.writetimeout]": 10000
  jpa:
    show-sql: true
    open-in-view: false
  # Jackson 3（Spring Boot 4 の既定）の JsonMapper をカスタマイズする。旧 JacksonConfig の
  # Jackson2ObjectMapperBuilderCustomizer をプロパティへ移設したもの。java.time は Jackson 3 が自動登録するため
  # JavaTimeModule の明示登録は不要。
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    # OffsetDateTime をオフセットに関わらず UTC で書く。timestamptz の読み直しは常に UTC なので、業務の時計（+09:00）で
    # 作った時刻も書き込み直後の応答と読み直しで同じ文字列になる。読み込み側は既定で UTC へ揃えられている。
    time-zone: UTC
    # Jackson 3 では日付関連のフラグは SerializationFeature から DateTimeFeature へ移動したため datatype.datetime 配下で指定する。
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      # DTO に無い項目を黙って捨てず 400 にする。捨てられた項目は画面上に何も現れず、
      # 保存は成功して値だけが入らないため、寛容にしておくと目視でも検知できない。
      fail-on-unknown-properties: true
      # 整数の項目へ届いた小数を切り捨てず 400 にする。既定は 1.5 を 1 として受けるので、
      # 保存は成功して入力と違う値が入る — 上と同じ「黙って別の値になる」欠陥類である。
      accept-float-as-int: false
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "kizuna:cache:"

  data:
    web:
      pageable:
        # 全一覧で共通の 1 回の取得件数の上限
        max-page-size: 100
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 2000ms
  servlet:
    # ファイルアップロードの上限（app.upload.max-file-size）と同じ値にする。別の値だと上限を上げても multipart がその手前で拒む
    multipart:
      max-file-size: ${app.upload.max-file-size}
      max-request-size: ${app.upload.max-file-size}
  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        keep-alive: 60s
        queue-capacity: 20
      thread-name-prefix: task-kizuna-

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include:
            - readinessState
            - db
            - redis
  health:
    db:
      enabled: true
    redis:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
app:
  domain: localhost
  scheme: http
  timezone: Asia/Tokyo
  receipt:
    # 操作の受領のキーの助言ロックを待つ上限。超えたら何も確定せず 503 で再送を促す。
    lock-timeout-seconds: 5
  # secret は既定値を持たない（APP_JWT_SECRET が無ければ起動を拒む）
  jwt:
    expiration: 3600000
    access-expiration: 900000
    refresh-expiration: 1209600000
  line:
    # LINE プラットフォーム API の基底 URL。統合テストのスタブ差し替え用の可変点で、運用では既定のまま。
    api-base-url: https://api.line.me
    # チャネル資格情報はシステム設定（t_system_configs）が優先。両方が空なら LINE ログインは無効。
    channel-id: ""
    channel-secret: ""
  upload:
    endpoint: http://localhost:8333
    bucket: uploads
    access-key: kizuna-storage
    secret-key: changeme
    url-prefix: /static/uploads/
    max-file-size: 10485760
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
