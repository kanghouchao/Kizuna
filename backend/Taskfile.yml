version: "3"

# バックエンド用タスク
vars:
  DOCKER_IMAGE: '{{default "kizuna-backend" .DOCKER_IMAGE}}'
  DOCKER_TAG: '{{default "latest" .DOCKER_TAG}}'

tasks:
  default:
    desc: ヘルプ情報を表示
    cmds:
      - task: help

  help:
    desc: ヘルプ情報を表示
    cmds:
      - task --list

  lint:
    desc: コードスタイルを検査（Docker lint ステージ経由）
    cmds:
      - echo "🧹 Docker の lint ステージでコードスタイル検査を実行中..."
      - |
        docker buildx build \
          --target lint \
          --output type=cacheonly \
          .

  format:
    desc: コードスタイルを自動修正（Spotless apply; ローカルで gradlew 実行）
    cmds:
      - echo "✍️  Spotless で自動整形を実行中..."
      - ./gradlew --no-daemon --warning-mode=all spotlessApply

  test-unit:
    desc: バックエンドの単体テストを実行（Docker test ステージ経由・coverage gate 込み）
    cmds:
      - echo "🧪  バックエンドの単体テストを実行中..."
      - |
        docker buildx build \
          --target test \
          -t {{.DOCKER_IMAGE}}-test:{{.DOCKER_TAG}} \
          --load \
          .

  test-integration:
    desc: バックエンドの統合テストを実行（compose ネットワーク接続）
    vars:
      # worktree ごとに compose プロジェクト名を分ける。固定名のままだと、下の事前 down /
      # defer down が別 worktree の実行中スタックを巻き込んで消してしまう。
      STACK_ID:
        sh: basename "$(git rev-parse --show-toplevel)" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g'
    env:
      # -p ではなく環境変数で与える（compose ファイルの name: より優先される）。
      COMPOSE_PROJECT_NAME: kizuna-backend-test-{{.STACK_ID}}
    cmds:
      - echo "🧪  バックエンドの統合テストを実行中（compose ネットワーク接続）..."
      # 事前回収: 前回 run が中断されると defer が走らずコンテナが残留し、`docker compose run` が
      # それを静かに再利用して tmpfs DB の汚れが偽陽性を生む（#412）。down はコンテナしか消さず
      # 匿名ボリューム（イメージ側 VOLUME 宣言由来）を取り残すため、`docker rm -fv` で
      # コンテナと匿名ボリュームを一緒に回収してから down でネットワークを畳む
      # （rm -fv は名前付きボリュームには届かないので、開発 DB を巻き込む経路が構造的に無い）。
      - docker compose -f docker-compose.test.yml ps -aq | xargs -r docker rm -fv
      - docker compose -f docker-compose.test.yml down --remove-orphans
      - defer: docker compose -f docker-compose.test.yml ps -aq | xargs -r docker rm -fv && docker compose -f docker-compose.test.yml down --remove-orphans
      - docker compose -f docker-compose.test.yml run --rm integration-test

  test:
    desc: バックエンドの全テストを実行（unit + integration、後方互換）
    cmds:
      - task: test-unit
      - task: test-integration

  build:
    desc: バックエンドDockerイメージをビルド
    cmds:
      - echo "🏗️  バックエンドDockerイメージをビルド中..."
      # --load: docker-container ドライバでも runtime イメージを docker デーモンへ載せる（task up が参照するため）
      - docker buildx build --load -t {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}} .

  clean:
    desc: Dockerイメージを削除
    cmds:
      - echo "🗑️  バックエンドDockerイメージを削除中..."
      - docker rmi {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}} 2>/dev/null || echo "イメージが存在しないか、既に削除されています"
      - docker rmi {{.DOCKER_IMAGE}}-test:{{.DOCKER_TAG}} 2>/dev/null || echo "テストイメージが存在しないか、既に削除されています"
      - docker rmi {{.DOCKER_IMAGE}}-lint:{{.DOCKER_TAG}} 2>/dev/null || echo "Lintイメージが存在しないか、既に削除されています"
