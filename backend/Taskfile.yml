version: "3"

# バックエンド用タスク
vars:
  DOCKER_IMAGE: '{{default "kizuna-backend" .DOCKER_IMAGE}}'
  DOCKER_TAG: '{{default "latest" .DOCKER_TAG}}'

tasks:
  default:
    desc: ヘルプ情報を表示
    cmds:
      - task: help

  help:
    desc: ヘルプ情報を表示
    cmds:
      - task --list

  lint:
    desc: コードスタイルを検査（Docker lint ステージ経由）
    cmds:
      - echo "🧹 Docker の lint ステージでコードスタイル検査を実行中..."
      - |
        docker buildx build \
          --target lint \
          --output type=cacheonly \
          .

  format:
    desc: コードスタイルを自動修正（Spotless apply; ローカルで gradlew 実行）
    cmds:
      - echo "✍️  Spotless で自動整形を実行中..."
      - ./gradlew --no-daemon --warning-mode=all spotlessApply

  test:
    desc: バックエンドの単体テストを実行（Docker test ステージ経由・coverage gate 込み）
    cmds:
      - echo "🧪  バックエンドの単体テストを実行中..."
      - |
        docker buildx build \
          --target test \
          -t {{.DOCKER_IMAGE}}-test:{{.DOCKER_TAG}} \
          --load \
          .

  test:integration:
    desc: 統合テスト（*IntegrationTest）を使い捨ての PostgreSQL・Redis と docker compose で実行（コンテナ・ボリュームを残さない）
    vars:
      STACK_ID:
        # 親ディレクトリ違いの同名 worktree が衝突しないよう、ルートパス全体の短いハッシュを足す。
        sh: |
          root=$(git rev-parse --show-toplevel)
          echo "$(basename "$root" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')-$(printf %s "$root" | cksum | cut -d' ' -f1)"
    env:
      COMPOSE_PROJECT_NAME: kizuna-integration-{{.STACK_ID}}
      # 並行する別 worktree の構築でタグが差し替わり、他人のコードを検証しないよう worktree ごとに分ける。
      INTEGRATION_IMAGE_TAG: '{{.STACK_ID}}'
      # 使い捨て DB の資格情報は実行ごとに乱数で作り、リポジトリに既定値を置かない。
      KIZUNA_POSTGRES_TEST_PASSWORD:
        sh: od -An -N16 -tx1 /dev/urandom | tr -d ' \n'
    cmds:
      - echo "🧪  統合テストを実行中..."
      - docker buildx build --target integration-test -t kizuna-backend-integration-test:{{.STACK_ID}} --load .
      # 中断で残った前回分を先に回収する。docker rm -fv は名前付きボリュームを消さない。
      - docker compose -f docker-compose.integration.yml ps -aq | xargs -r docker rm -fv
      - docker compose -f docker-compose.integration.yml down --remove-orphans
      - defer: docker compose -f docker-compose.integration.yml ps -aq | xargs -r docker rm -fv && docker compose -f docker-compose.integration.yml down --remove-orphans
      - docker compose -f docker-compose.integration.yml run --rm integration-test

  build:
    desc: バックエンドDockerイメージをビルド
    cmds:
      - echo "🏗️  バックエンドDockerイメージをビルド中..."
      # --load: docker-container ドライバでも runtime イメージを docker デーモンへ載せる（task up が参照するため）
      - docker buildx build --load -t {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}} .

  clean:
    desc: Dockerイメージを削除
    cmds:
      - echo "🗑️  バックエンドDockerイメージを削除中..."
      - docker rmi {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}} 2>/dev/null || echo "イメージが存在しないか、既に削除されています"
      - docker rmi {{.DOCKER_IMAGE}}-test:{{.DOCKER_TAG}} 2>/dev/null || echo "テストイメージが存在しないか、既に削除されています"
      - docker rmi {{.DOCKER_IMAGE}}-lint:{{.DOCKER_TAG}} 2>/dev/null || echo "Lintイメージが存在しないか、既に削除されています"
