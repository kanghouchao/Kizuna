# docker-compose.yml
name: kizuna

services:
  # Database: PostgreSQL
  database:
    image: dhi.io/postgres:18-alpine3.23
    container_name: database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kizuna}
      POSTGRES_USER: ${POSTGRES_USER:-kizuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kizuna} -d ${POSTGRES_DB:-kizuna}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache: Redis
  cache:
    image: dhi.io/redis:8-alpine3.23
    container_name: redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-password}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-password}
    volumes:
      - redis-data:/data
    networks:
      - network
    healthcheck:
      # -e: NOAUTH などのエラー応答でも終了コード 1 にする（grep が無いので PONG 照合の代わり）
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend: Java Spring Boot
  backend:
    image: kizuna-backend:latest
    container_name: backend
    networks:
      - network
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-database}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-kizuna}
      - POSTGRES_USER=${POSTGRES_USER:-kizuna}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - REDIS_HOST=${REDIS_HOST:-cache}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://storage:8333}
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-kizuna-storage}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-changeme}
      - SPRING_PROFILE
      - SERVER_PORT
      - APP_NAME
      - APP_DOMAIN
      - APP_SCHEME
      - APP_TIMEZONE
      - APP_JWT_SECRET
      - APP_JWT_EXPIRATION_MS
      - APP_UPLOAD_URL_PREFIX
      - APP_UPLOAD_MAX_FILE_SIZE
      - POSTGRES_SSLMODE
      - POSTGRES_SSL
      - HIKARI_MINIMUM_IDLE
      - HIKARI_MAXIMUM_POOL_SIZE
      - HIKARI_IDLE_TIMEOUT
      - HIKARI_MAX_LIFETIME
      - HIKARI_CONNECTION_TIMEOUT
      - HIKARI_LEAK_DETECTION_THRESHOLD
      - HIKARI_VALIDATION_TIMEOUT
      - HIKARI_INITIALIZATION_FAIL_TIMEOUT
      - REDIS_DATABASE
      - REDIS_SSL
      - REDIS_TIMEOUT
      - REDIS_CLIENT_TYPE
      - LETTUCE_POOL_MAX_ACTIVE
      - LETTUCE_POOL_MAX_IDLE
      - LETTUCE_POOL_MIN_IDLE
      - LETTUCE_POOL_MAX_WAIT
      - SPRING_CACHE_TTL_MS
      - SPRING_CACHE_NULL_VALUES
      - SPRING_CACHE_USE_KEY_PREFIX
      - SPRING_CACHE_KEY_PREFIX
      - SPRING_JPA_SHOW_SQL
      - SPRING_JPA_OPEN_IN_VIEW
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL
      - SPRING_MAIL_HOST
      - SPRING_MAIL_PORT
      - SPRING_MAIL_USERNAME
      - SPRING_MAIL_PASSWORD
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      # 実行イメージにシェルも curl も無いので、イメージ同梱の HealthCheck クラスで actuator を叩く
      test: ["CMD", "java", "-Xms8m", "-Xmx32m", "-XX:TieredStopAtLevel=1", "-cp", "/app/healthcheck", "HealthCheck"]
      start_period: 15s
      interval: 5s
      timeout: 3s
      retries: 3
    restart: on-failure:3

  # S3 互換オブジェクトストレージ
  storage:
    image: chrislusf/seaweedfs:4.50
    container_name: storage
    command: mini -dir=/data -admin.ui=true -webdav=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-kizuna-storage}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-changeme}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:23646:23646"
    networks:
      - network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  # Frontend: next.js
  frontend:
    image: kizuna-frontend:latest
    container_name: frontend
    networks:
      - network
    environment:
      - STORE_LOOKUP_API_URL=${STORE_LOOKUP_API_URL:-http://backend:8080/stores/lookup}
      - STORE_CONFIG_API_URL=${STORE_CONFIG_API_URL:-http://backend:8080/config/public}
      - NODE_ENV
      - APP_DOMAIN
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  # Traefik: The reverse proxy
  gateway:
    image: dhi.io/traefik:3-alpine3.23
    container_name: traefik
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "./traefik/:/etc/traefik/:ro"
    networks:
      network:
        aliases:
          - store1.kizuna.test
          - kizuna.test
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  network:
    driver: bridge

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  seaweedfs-data:
    driver: local
