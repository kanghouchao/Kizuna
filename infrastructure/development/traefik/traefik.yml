# traefik/development/traefik.yml
# Configuration for DEVELOPMENT (HTTP ONLY).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

# Enable ping for health checks
ping: {}

# Define the HTTP entrypoint
entryPoints:
  web:
    address: ":80"

# Configure the Docker provider
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    # docker provider は daemon 上の全コンテナを見る。E2E は同じ daemon 上に別プロジェクトの
    # フルスタックを立てるため、制約が無いと router 名（backend / frontend / storage）が衝突し、
    # 開発スタックのリクエストが E2E 側のコンテナへ振り分けられる。自プロジェクトだけを対象にする。
    constraints: "Label(`com.docker.compose.project`,`kizuna`)"
