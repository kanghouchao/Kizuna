# traefik/development/traefik.yml
# Configuration for DEVELOPMENT (HTTP ONLY).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

# 開発ではルーティングの確認用に起動ログとアクセスログを標準出力へ出す（既定はアクセスログなし・ERROR のみ）
log:
  level: INFO

accessLog: {}

# Enable ping for health checks
ping: {}

# Define the HTTP entrypoint
entryPoints:
  web:
    address: ":80"

# ルーティングは同じディレクトリの dynamic.yml に静的に書く
providers:
  file:
    filename: /etc/traefik/dynamic.yml
