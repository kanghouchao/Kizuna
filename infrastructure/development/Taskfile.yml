version: "3"

# 開発環境用タスク
#
# プロジェクト名は docker-compose.yml の `name: kizuna` を唯一の出所とし、ここで -p を渡さない。
# traefik.yml の docker provider 制約がその名前を直に書いているため、上書き手段を残すと
# 制約だけ取り残されて router がゼロになる（全リクエストが静かに 404 になる）。
vars:
  service: '{{default "" .service}}'

tasks:
  ensure-env:
    desc: worktree に .env が無ければ主検出からコピーする（開発環境のみの補完。release には適用しない）
    internal: true
    status:
      - test -f .env
    cmds:
      - |
        MAIN_ROOT="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
        if [ "$MAIN_ROOT" != "$(git rev-parse --show-toplevel)" ] && [ -f "$MAIN_ROOT/infrastructure/development/.env" ]; then
          cp "$MAIN_ROOT/infrastructure/development/.env" .env
          echo "🔑 .env が無いため主検出（$MAIN_ROOT）からコピーした"
        else
          echo "❗ .env がありません。infrastructure/.env.example を参照して配置してください" >&2
          exit 1
        fi

  up:
    desc: サービスを起動
    deps: [ensure-env]
    cmds:
      - docker compose up -d --timestamps --wait

  down:
    desc: サービスを停止
    cmds:
      - docker compose down

  ps:
    desc: サービス状態を表示
    cmds:
      - docker compose ps

  logs:
    desc: ログを表示
    cmds:
      - |
        if [ -n "{{.service}}" ]; then
          echo "📜 {{.service}}サービスのログを表示中..."
          docker compose logs -f {{.service}}
        else
          docker compose logs -f
        fi

  exec:
    desc: サービスコンテナに入る
    cmds:
      - |
        if [ -n "{{.service}}" ]; then
          docker compose exec {{.service}} sh
        else
          echo "❗ serviceを指定してください。例: task exec service=backend"
          exit 1
        fi

  restart:
    desc: サービスを再起動
    cmds:
      - |
        if [ -n "{{.service}}" ]; then
          echo "🔄 {{.service}}サービスを再起動中..."
          docker compose restart {{.service}}
        else
          echo "🔄 すべてのサービスを再起動中..."
          docker compose restart
        fi
