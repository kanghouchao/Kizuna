# docker-compose.yml
name: kizuna

services:
  # Database: PostgreSQL
  database:
    image: dhi.io/postgres:18-alpine3.23
    container_name: database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kizuna}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER を .env に設定してください（旧 DB_USERNAME から改名。既存ボリュームがある場合は初回起動時と同じ値にすること）}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください（旧 DB_PASSWORD から改名。既存ボリュームがある場合は初回起動時と同じ値にすること）}
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-kizuna}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache: Redis
  cache:
    image: dhi.io/redis:8-alpine3.23
    container_name: redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD を .env に設定してください}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD を .env に設定してください}
    volumes:
      - redis-data:/data
    networks:
      - network
    healthcheck:
      # -e: NOAUTH などのエラー応答でも終了コード 1 にする（grep が無いので PONG 照合の代わり）
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend: Java Spring Boot
  backend:
    image: kizuna-backend:latest
    container_name: backend
    tmpfs:
      # backend は非 root（65532）で動くため、所有者を合わせないと mode=0700 で書けない
      - /tmp/kizuna-private-attachments:size=134217728,mode=0700,uid=65532,gid=65532
    networks:
      - network
      - private-network
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-database}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-kizuna}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER を .env に設定してください（旧 DB_USERNAME から改名）}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください（旧 DB_PASSWORD から改名）}
      - REDIS_HOST=${REDIS_HOST:-cache}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD を .env に設定してください}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://storage:8333}
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?S3_ACCESS_KEY を .env に設定してください}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?S3_SECRET_KEY を .env に設定してください}
      - APP_PRIVATE_ATTACHMENTS_ENABLED=${APP_PRIVATE_ATTACHMENTS_ENABLED:-false}
      - APP_PRIVATE_ATTACHMENTS_ENDPOINT=http://private-storage:8333
      - APP_PRIVATE_ATTACHMENTS_BUCKET=applicant-images
      - APP_PRIVATE_ATTACHMENTS_ACCESS_KEY=${PRIVATE_S3_ACCESS_KEY:?PRIVATE_S3_ACCESS_KEY を .env に設定してください（公開側の S3_ACCESS_KEY とは別の値）}
      - APP_PRIVATE_ATTACHMENTS_SECRET_KEY=${PRIVATE_S3_SECRET_KEY:?PRIVATE_S3_SECRET_KEY を .env に設定してください（公開側の S3_SECRET_KEY とは別の値）}
      - APP_APPLICANT_ANONYMIZATION_ENABLED=${APP_APPLICANT_ANONYMIZATION_ENABLED:-false}
      - APP_APPLICANT_ANONYMIZATION_SERVICE_USER_ID
      - APP_POINTS_EXPIRY_ENABLED=${APP_POINTS_EXPIRY_ENABLED:-false}
      - APP_POINTS_EXPIRY_SERVICE_USER_ID
      - APP_SCHEME=${APP_SCHEME:-https}
      - APP_JWT_SECRET=${APP_JWT_SECRET:?APP_JWT_SECRET を .env に設定してください（HMAC-SHA256 のため 256bit 以上）}
      - SPRING_PROFILE
      - SERVER_PORT
      - APP_NAME
      - APP_DOMAIN
      - APP_TIMEZONE
      - APP_JWT_EXPIRATION_MS
      - APP_UPLOAD_URL_PREFIX
      - APP_UPLOAD_MAX_FILE_SIZE
      - POSTGRES_SSLMODE
      - POSTGRES_SSL
      - HIKARI_MINIMUM_IDLE
      - HIKARI_MAXIMUM_POOL_SIZE
      - HIKARI_IDLE_TIMEOUT
      - HIKARI_MAX_LIFETIME
      - HIKARI_CONNECTION_TIMEOUT
      - HIKARI_LEAK_DETECTION_THRESHOLD
      - HIKARI_VALIDATION_TIMEOUT
      - HIKARI_INITIALIZATION_FAIL_TIMEOUT
      - REDIS_DATABASE
      - REDIS_SSL
      - REDIS_TIMEOUT
      - REDIS_CLIENT_TYPE
      - LETTUCE_POOL_MAX_ACTIVE
      - LETTUCE_POOL_MAX_IDLE
      - LETTUCE_POOL_MIN_IDLE
      - LETTUCE_POOL_MAX_WAIT
      - SPRING_CACHE_TTL_MS
      - SPRING_CACHE_NULL_VALUES
      - SPRING_CACHE_USE_KEY_PREFIX
      - SPRING_CACHE_KEY_PREFIX
      - SPRING_JPA_SHOW_SQL
      - SPRING_JPA_OPEN_IN_VIEW
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL
      - SPRING_MAIL_HOST
      - SPRING_MAIL_PORT
      - SPRING_MAIL_USERNAME
      - SPRING_MAIL_PASSWORD
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
      # 添付機能を無効にしている間も private-storage の不調で backend を止めない。有効時は backend の起動時検査が落とす
      private-storage:
        condition: service_healthy
        required: false
    healthcheck:
      # 実行イメージにシェルも curl も無いので、イメージ同梱の HealthCheck クラスで actuator を叩く
      test: ["CMD", "java", "-Xms8m", "-Xmx32m", "-XX:TieredStopAtLevel=1", "-cp", "/app/healthcheck", "HealthCheck"]
      start_period: 15s
      interval: 5s
      timeout: 3s
      retries: 3
    restart: on-failure:3

  # S3 互換オブジェクトストレージ
  storage:
    image: chrislusf/seaweedfs:4.50
    container_name: storage
    command: mini -dir=/data -admin.ui=false -webdav=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY を .env に設定してください}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY を .env に設定してください}
    volumes:
      - seaweedfs-data:/data
    networks:
      - network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  # 応募者添付の非公開 S3。Traefik のルートもホストポートも持たず、backend とだけ共有する private-network に置く。
  # mini は S3 以外に認証の無い filer（8888）や master も開くため、他のサービスと同じネットワークに置かない。
  # バケットはここで宣言し backend は作らない。ボリュームは意図してバックアップしない（infrastructure/README.md）
  private-storage:
    image: chrislusf/seaweedfs:4.50
    container_name: private-storage
    command: mini -dir=/data -admin.ui=false -webdav=false -bucket=applicant-images
    environment:
      AWS_ACCESS_KEY_ID: ${PRIVATE_S3_ACCESS_KEY:?PRIVATE_S3_ACCESS_KEY を .env に設定してください（公開側の S3_ACCESS_KEY とは別の値）}
      AWS_SECRET_ACCESS_KEY: ${PRIVATE_S3_SECRET_KEY:?PRIVATE_S3_SECRET_KEY を .env に設定してください（公開側の S3_SECRET_KEY とは別の値）}
    volumes:
      - private-seaweedfs-data:/data
    networks:
      - private-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  # Frontend: next.js
  frontend:
    image: kizuna-frontend:latest
    container_name: frontend
    networks:
      - network
    environment:
      - NODE_ENV
      - APP_DOMAIN
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure:3

  # Traefik: The reverse proxy
  gateway:
    image: dhi.io/traefik:3-alpine3.23
    container_name: traefik
    # traefik/dynamic.yml が証明書の対象ドメインとして読む
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-kizuna.jp}
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "./traefik/:/etc/traefik/:ro"
      - "acme-data:/letsencrypt"
    networks:
      - network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  network:
    driver: bridge
  # 外部への出口も持たない
  private-network:
    driver: bridge
    internal: true

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  seaweedfs-data:
    driver: local
  private-seaweedfs-data:
    driver: local
  acme-data:
    driver: local
