
# traefik/prod/traefik.yml
# Configuration for PRODUCTION (HTTPS with Let's Encrypt).

global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  # frontend のサーバ側から backend への経路（BACKEND_URL）。ホストには公開せず、HTTPS への転送も証明書も付けない
  internal:
    address: ":8081"

providers:
  file:
    filename: /etc/traefik/dynamic.yml

certificatesResolvers:
  letsencrypt:
    acme:
      email: "kanhouchou@gmail.com"
      storage: "/letsencrypt/acme.json"
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      httpChallenge:
        entryPoint: web
