# E2E 専用の使い捨てフルスタック
#
# 開発スタック（project kizuna）とは何も共有しない：ホストポートを公開せず、container_name も
# 持たず、DB / キャッシュ / ストレージは tmpfs で毎回まっさらに作り直す。プロジェクト名は
# COMPOSE_PROJECT_NAME（root Taskfile が worktree 名から導出する）で一意化されるため、
# 複数の worktree が同時に e2e を走らせても衝突しない。
#
# name: は既定値で、COMPOSE_PROJECT_NAME でも -p でも上書きできる。どちらで与えても gateway の
# docker provider 制約は同じ名前に追随する（compose は解決後のプロジェクト名を
# ${COMPOSE_PROJECT_NAME} として展開に渡すため）。ただし制約の既定値は下の name: と同じ文字列を
# 直に書いているので、片方だけ書き換えると、どちらも与えずに手で叩いたとき router がゼロになる。
#
# 実行は root の `task e2e`。手で叩く場合は事前 down を忘れないこと（残骸の黙った再利用を防ぐ）。
name: kizuna-e2e

services:
  database:
    image: postgres:18-alpine
    # 永続化しない。実行ごとにシードからやり直すことで、手動 QA の残骸や前回実行の書き込みが
    # 次の実行を汚染する経路そのものを断つ。
    tmpfs:
      - /var/lib/postgresql
    environment:
      POSTGRES_DB: kizuna
      POSTGRES_USER: kizuna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kizuna -d kizuna"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:8.8.0-alpine3.23
    # 資格情報は開発用 compose と同じ変数参照形式（既定値は E2E 専用のダミー値）
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-password}
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    tmpfs:
      - /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
    networks:
      - network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storage.rule=PathPrefix(`/static`)"
      - "traefik.http.routers.storage.entrypoints=web"
      - "traefik.http.routers.storage.middlewares=storage-strip@docker"
      - "traefik.http.routers.storage.service=storage"
      - "traefik.http.services.storage.loadbalancer.server.port=9000"
      - "traefik.http.middlewares.storage-strip.stripPrefix.prefixes=/static"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # タグは worktree ごとに分ける（root Taskfile が E2E_IMAGE_TAG を export する）。
    # latest 固定だと、別 worktree の task build が同じタグを上書きし、相手のコードを検証してしまう。
    image: kizuna-backend:${E2E_IMAGE_TAG:-latest}
    networks:
      - network
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_DB: kizuna
      POSTGRES_USER: kizuna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      MINIO_ENDPOINT: http://storage:9000
      MINIO_BUCKET: uploads
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
      # E2E はデモデータ（店舗 1/2 と店長・スタッフ）に依存する。application.yml の既定は
      # production＝デモデータ無しなので、ここを外すと全シナリオがログインで落ちる。
      LIQUIBASE_CONTEXTS: demo
      # HMAC-SHA256 の要件（RFC 7518）で 256bit 以上必要（秘密鍵は raw bytes として解釈される）
      APP_JWT_SECRET: ${APP_JWT_SECRET:-e2e-test-secret-0123456789abcdef}
      # gateway の network alias と一致させる。frontend/backend はこの値で platform ドメインと
      # 店舗ドメインを判別するため、alias とずれると店舗として解決されて全シナリオが崩れる。
      APP_DOMAIN: kizuna.test
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.middlewares=backend-strip@docker"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.backend-strip.stripPrefix.prefixes=/api"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      start_period: 15s
      interval: 5s
      timeout: 3s
      retries: 3

  frontend:
    image: kizuna-frontend:${E2E_IMAGE_TAG:-latest}
    networks:
      - network
    environment:
      STORE_LOOKUP_API_URL: http://backend:8080/platform/stores/lookup
      STORE_CONFIG_API_URL: http://backend:8080/store/config/public
      APP_DOMAIN: kizuna.test
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`) && !PathPrefix(`/api`) && !PathPrefix(`/static`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: traefik:v3.7.6
    # 設定ファイルはマウントせず CLI 引数で完結させる（開発環境の traefik.yml への相乗りを避ける）。
    command:
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"
      - "--ping=true"
      - "--entryPoints.web.address=:80"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
      # docker provider は daemon 上の全コンテナを見るため、制約が無いと同時に動いている
      # 開発スタックや別 worktree の E2E スタックのコンテナまで拾い、router 名
      # （backend / frontend / storage）が衝突して他プロジェクトへ振り分けられる。
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME:-kizuna-e2e}`)"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    # ホストポートは公開しない。テストランナーはこのネットワークの内側から alias で到達するため
    # 不要であり、公開しないことが複数スタック同時起動の前提になっている。
    networks:
      network:
        aliases:
          - store1.kizuna.test
          - kizuna.test
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10

  e2e:
    # タグは e2e/package.json の @playwright/test バージョンから派生（root Taskfile の e2e が
    # PLAYWRIGHT_VERSION を export する）。既定値は単独 compose 実行時のフォールバック。
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:-1.61.1}-noble
    working_dir: /e2e
    volumes:
      # ソースを bind-mount。成果物（test-results / playwright-report）はホスト e2e/ に残る。
      - .:/e2e
      # コンテナ側（linux）の node_modules を、bind-mount したホスト e2e/ から分離するための
      # 匿名 volume（`docker compose run --rm` のコンテナ削除と一緒に消える。中断で残った回は
      # Taskfile の事前回収 `docker rm -fv` が拾う）。ホスト（別プラットフォーム）の node_modules
      # との衝突を避けるのが目的で、npm ci は毎回作り直すため取得の高速化ではなく、残す理由も無い。
      - /e2e/node_modules
    environment:
      # gateway alias 経由で store ドメインへ到達する baseURL。
      BASE_URL: http://store1.kizuna.test
    # gateway の healthcheck は traefik の ping しか見ないため、プロセスが生きていることしか
    # 保証しない。docker provider が router を登録したかどうかは別問題で、制約とプロジェクト名が
    # ずれていれば router はゼロのまま healthy になる。実際に router を通る経路で疎通を確かめ、
    # 到達しないなら原因を名指しして落ちる（全シナリオが理由不明で赤くなるのを避ける）。
    command:
      - sh
      - -c
      - |
        i=0
        until curl -sf -o /dev/null http://store1.kizuna.test/; do
          i=$$((i + 1))
          if [ "$$i" -ge 60 ]; then
            echo "❌ gateway 経由で frontend に到達できません（router 未登録の可能性）"
            exit 1
          fi
          sleep 2
        done
        npm ci && npx bddgen && npx playwright test
    # backend / frontend が healthy になってから gateway が起動する連鎖に乗るための依存。
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - network

networks:
  network:
    driver: bridge
