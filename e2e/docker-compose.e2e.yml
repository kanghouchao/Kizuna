# E2E 専用の使い捨てフルスタック
#
# 開発スタック（project kizuna）とは何も共有しない：ホストポートを公開せず、container_name も
# 持たず、DB / キャッシュ / ストレージは tmpfs で毎回まっさらに作り直す。プロジェクト名は
# COMPOSE_PROJECT_NAME（root Taskfile が worktree 名から導出する）で一意化されるため、
# 複数の worktree が同時に e2e を走らせても衝突しない。
#
# 実行は root の `task e2e`。手で叩く場合は事前 down を忘れないこと（残骸の黙った再利用を防ぐ）。
name: kizuna-e2e

services:
  database:
    image: dhi.io/postgres:18-alpine3.23
    # 永続化しない。実行ごとにシードからやり直すことで、手動 QA の残骸や前回実行の書き込みが
    # 次の実行を汚染する経路そのものを断つ。
    tmpfs:
      # DHI の postgres は最初から uid 70 で動き、root 所有の tmpfs では initdb できない
      - /var/lib/postgresql:uid=70,gid=70
    environment:
      POSTGRES_DB: kizuna
      POSTGRES_USER: kizuna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kizuna -d kizuna"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: dhi.io/redis:8-alpine3.23
    # 資格情報は開発用 compose と同じ変数参照形式（既定値は E2E 専用のダミー値）
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-password}
    networks:
      - network
    healthcheck:
      # -e: NOAUTH などのエラー応答でも終了コード 1 にする（grep が無いので PONG 照合の代わり）
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -admin.ui=false -webdav=false
    tmpfs:
      - /data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-kizuna-storage}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-storage-test-secret}
    networks:
      - network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  private-storage:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -admin.ui=false -webdav=false -bucket=applicant-images -volume.max=4 -master.volumeSizeLimitMB=16
    tmpfs:
      - /data:size=134217728
    environment:
      AWS_ACCESS_KEY_ID: ${PRIVATE_S3_ACCESS_KEY:-applicant-test-storage}
      AWS_SECRET_ACCESS_KEY: ${PRIVATE_S3_SECRET_KEY:-applicant-test-secret}
    networks:
      - network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    tmpfs:
      # backend は非 root（65532）で動くため、所有者を合わせないと mode=0700 で書けない
      - /tmp/kizuna-private-attachments:size=134217728,mode=0700,uid=65532,gid=65532
    # タグは worktree ごとに分ける（root Taskfile が E2E_IMAGE_TAG を export する）。
    # latest 固定だと、別 worktree の task build が同じタグを上書きし、相手のコードを検証してしまう。
    image: kizuna-backend:${E2E_IMAGE_TAG:-latest}
    networks:
      - network
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_DB: kizuna
      POSTGRES_USER: kizuna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      APP_PRIVATE_ATTACHMENTS_ENABLED: "true"
      APP_PRIVATE_ATTACHMENTS_ENDPOINT: http://private-storage:8333
      APP_PRIVATE_ATTACHMENTS_BUCKET: applicant-images
      APP_PRIVATE_ATTACHMENTS_ACCESS_KEY: ${PRIVATE_S3_ACCESS_KEY:-applicant-test-storage}
      APP_PRIVATE_ATTACHMENTS_SECRET_KEY: ${PRIVATE_S3_SECRET_KEY:-applicant-test-secret}
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kizuna-storage}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-storage-test-secret}
      # HMAC-SHA256 の要件（RFC 7518）で 256bit 以上必要（秘密鍵は raw bytes として解釈される）
      APP_JWT_SECRET: ${APP_JWT_SECRET:-e2e-test-secret-0123456789abcdef}
      # gateway の network alias と一致させる。frontend/backend はこの値で アプリドメインと
      # 店舗ドメインを判別するため、alias とずれると店舗として解決されて全シナリオが崩れる。
      APP_DOMAIN: kizuna.test
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
      private-storage:
        condition: service_healthy
    healthcheck:
      # 実行イメージにシェルも curl も無いので、イメージ同梱の HealthCheck クラスで actuator を叩く
      test: ["CMD", "java", "-Xms8m", "-Xmx32m", "-XX:TieredStopAtLevel=1", "-cp", "/app/healthcheck", "HealthCheck"]
      start_period: 15s
      interval: 5s
      timeout: 3s
      retries: 3

  frontend:
    image: kizuna-frontend:${E2E_IMAGE_TAG:-latest}
    networks:
      - network
    environment:
      STORE_LOOKUP_API_URL: http://backend:8080/admin/stores/lookup
      STORE_CONFIG_API_URL: http://backend:8080/store/config/public
      APP_DOMAIN: kizuna.test
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: dhi.io/traefik:3-alpine3.23
    # 静的設定は CLI 引数で完結させ、ルーティングだけ e2e 専用の dynamic.yml を読む
    # （開発環境の traefik/ には相乗りしない）。
    command:
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"
      - "--ping=true"
      - "--entryPoints.web.address=:80"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
    volumes:
      - "./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
    # ホストポートは公開しない。テストランナーはこのネットワークの内側から alias で到達するため
    # 不要であり、公開しないことが複数スタック同時起動の前提になっている。
    networks:
      network:
        aliases:
          - store1.kizuna.test
          - kizuna.test
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10

  e2e:
    # タグは e2e/package.json の @playwright/test バージョンから派生（root Taskfile の e2e が
    # PLAYWRIGHT_VERSION を export する）。既定値は単独 compose 実行時のフォールバック。
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:-1.61.1}-noble
    working_dir: /e2e
    volumes:
      # ソースを bind-mount。成果物（test-results / playwright-report）はホスト e2e/ に残る。
      - .:/e2e
      # コンテナ側（linux）の node_modules を、bind-mount したホスト e2e/ から分離するための
      # 匿名 volume（`docker compose run --rm` のコンテナ削除と一緒に消える。中断で残った回は
      # Taskfile の事前回収 `docker rm -fv` が拾う）。ホスト（別プラットフォーム）の node_modules
      # との衝突を避けるのが目的で、npm install は毎回作り直すため取得の高速化ではなく、残す理由も無い。
      - /e2e/node_modules
    environment:
      # gateway alias 経由で store ドメインへ到達する baseURL。
      BASE_URL: http://store1.kizuna.test
      # PDF の全件快照検証だけが、専用 DB のテストデータと読取待機を制御する。
      PGHOST: database
      PGDATABASE: kizuna
      PGUSER: kizuna
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
    # gateway の healthcheck は traefik の ping しか見ず、ルーティング設定の読込失敗でも healthy になる。
    # 実際に router を通る経路で疎通を確かめ、到達しないなら原因を名指しして落ちる
    # （全シナリオが理由不明で赤くなるのを避ける）。
    command:
      - sh
      - -c
      - |
        i=0
        until curl -sf -o /dev/null http://store1.kizuna.test/; do
          i=$$((i + 1))
          if [ "$$i" -ge 60 ]; then
            echo "❌ gateway 経由で frontend に到達できません（dynamic.yml のルーティング未読込の可能性）"
            exit 1
          fi
          sleep 2
        done
        npm install --legacy-peer-deps --no-audit --no-fund && npm run test:e2e
    # backend / frontend が healthy になってから gateway が起動する連鎖に乗るための依存。
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - network

networks:
  network:
    driver: bridge
