# traefik のルーティング定義（file provider）。転送先は compose のサービス名で、同じネットワーク内だけで解決する。
http:
  routers:
    backend:
      rule: "PathPrefix(`/api`)"
      entryPoints:
        - web
      middlewares:
        - backend-strip
      service: backend
    storage:
      rule: "PathPrefix(`/static`)"
      entryPoints:
        - web
      middlewares:
        - storage-strip
      service: storage
    frontend:
      rule: "PathPrefix(`/`) && !PathPrefix(`/api`) && !PathPrefix(`/static`)"
      entryPoints:
        - web
      service: frontend

  middlewares:
    backend-strip:
      stripPrefix:
        prefixes:
          - /api
    storage-strip:
      stripPrefix:
        prefixes:
          - /static

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:8080"
    storage:
      loadBalancer:
        servers:
          - url: "http://storage:8333"
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"
